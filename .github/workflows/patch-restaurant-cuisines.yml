name: Patch restaurant cuisines screen

on:
  push:
    branches:
      - fix/database-driven-restaurant-cuisines
    paths:
      - .github/workflows/patch-restaurant-cuisines.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch restaurants screen
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('src/app/category/restaurants.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {text.count(old)}')
              text = text.replace(old, new, 1)

          replace_once(
              "import {\n  listStores,\n  type StoreSummary,\n} from '../../services/catalog-service';\n",
              "import {\n  listStores,\n  type StoreSummary,\n} from '../../services/catalog-service';\nimport listRestaurantCuisines, {\n  type RestaurantCuisine,\n} from '../../services/restaurant-cuisines-service';\n",
              'restaurant cuisine import',
          )

          replace_once(
              "type CuisineItem = {\n  key: string;\n  label: string;\n  image: ImageSourcePropType;\n  keywords: string[];\n};",
              "type CuisineItem = {\n  key: string;\n  label: string;\n  image: ImageSourcePropType;\n  keywords: string[];\n  storeIds: string[];\n};",
              'CuisineItem type',
          )

          dynamic_block = r'''const CUISINE_KEYWORDS: Record<string, string[]> = {
  arabic: [
    'عربي',
    'شامي',
    'سوري',
    'لبناني',
  ],
  'arabic-sweets': [
    'حلويات شرقية',
    'بقلاوة',
    'كنافة',
  ],
  bakery: [
    'مخبوزات',
    'مخبز',
    'باتيه',
    'كرواسون',
  ],
  beverages: [
    'مشروبات',
    'عصير',
    'كوكتيل',
  ],
  breakfast: [
    'فطار',
    'إفطار',
    'بيض',
  ],
  burgers: [
    'برجر',
    'burger',
  ],
  cakes: [
    'كيك',
    'تورتة',
    'cake',
  ],
  chicken: [
    'فراخ',
    'دجاج',
    'chicken',
  ],
  chocolate: [
    'شوكولاتة',
    'chocolate',
  ],
  coffee: [
    'قهوة',
    'شاي',
    'كافيه',
    'coffee',
  ],
  crepes: [
    'كريب',
    'crepe',
  ],
  desserts: [
    'حلويات',
    'ديسرت',
    'dessert',
  ],
  egyptian: [
    'مصري',
    'طواجن',
    'محشي',
  ],
  'fast-food': [
    'وجبات سريعة',
    'fast food',
  ],
  'foul-falafel': [
    'فول',
    'طعمية',
    'فلافل',
  ],
  'fried-chicken': [
    'فرايد تشيكن',
    'فراخ مقلية',
    'بروست',
    'fried chicken',
  ],
  grills: [
    'مشويات',
    'كباب',
    'كفتة',
    'grill',
  ],
  healthy: [
    'صحي',
    'دايت',
    'سلطة',
    'healthy',
  ],
  koshary: [
    'كشري',
    'koshary',
  ],
  pasta: [
    'مكرونة',
    'باستا',
    'pasta',
  ],
  pies: [
    'فطير',
    'فطائر',
    'pie',
  ],
  pizza: [
    'بيتزا',
    'pizza',
  ],
  sandwiches: [
    'ساندوتش',
    'سندوتش',
    'sandwich',
  ],
  seafood: [
    'سمك',
    'سي فود',
    'مأكولات بحرية',
    'seafood',
  ],
  shawarma: [
    'شاورما',
    'shawarma',
  ],
  sushi: [
    'سوشي',
    'sushi',
  ],
};

function toCuisineItem(
  cuisine: RestaurantCuisine,
): CuisineItem {
  const keywords = [
    cuisine.nameAr,
    cuisine.nameEn ?? '',
    ...(CUISINE_KEYWORDS[cuisine.slug] ?? []),
  ].filter(Boolean);

  return {
    key: cuisine.slug,
    label: cuisine.nameAr,
    image: cuisine.imageUrl
      ? { uri: cuisine.imageUrl }
      : require('../../assets/cuisines/view-all.png'),
    keywords,
    storeIds: cuisine.storeIds,
  };
}'''

          pattern = re.compile(
              r"const CUISINES: CuisineItem\[\] = \[.*?\n\];\n\nconst PREVIEW_CUISINE_KEYS = \[.*?\n\];",
              re.S,
          )
          text, count = pattern.subn(dynamic_block, text, count=1)
          if count != 1:
              raise SystemExit(f'dynamic cuisine block: expected one match, found {count}')

          replace_once(
              "  const [stores, setStores] =\n    useState<StoreSummary[]>([]);\n",
              "  const [stores, setStores] =\n    useState<StoreSummary[]>([]);\n\n  const [cuisines, setCuisines] =\n    useState<CuisineItem[]>([]);\n",
              'cuisine state',
          )

          replace_once(
              "      const [\n        bootstrap,\n        loadedStores,\n      ] = await Promise.all([",
              "      const [\n        bootstrap,\n        loadedStores,\n        loadedCuisines,\n      ] = await Promise.all([",
              'Promise.all destructuring',
          )

          replace_once(
              "          serviceAreaId:\n            savedServiceAreaId ??\n            undefined,\n        }),\n      ]);",
              "          serviceAreaId:\n            savedServiceAreaId ??\n            undefined,\n        }),\n        listRestaurantCuisines(),\n      ]);",
              'load cuisines promise',
          )

          replace_once(
              "      setCategory(loadedCategory);\n      setStores(loadedStores);",
              "      setCategory(loadedCategory);\n      setStores(loadedStores);\n      setCuisines(\n        loadedCuisines.map(toCuisineItem),\n      );",
              'set cuisines',
          )

          replace_once(
              "      setCategory(null);\n      setStores([]);",
              "      setCategory(null);\n      setStores([]);\n      setCuisines([]);",
              'clear cuisines on error',
          )

          preview_pattern = re.compile(
              r"  const previewCuisines =\n    useMemo\(.*?\n    \);\n\n  const visibleStores =",
              re.S,
          )
          preview_replacement = "  const previewCuisines =\n    useMemo(\n      () => cuisines.slice(0, 5),\n      [cuisines],\n    );\n\n  const visibleStores ="
          text, count = preview_pattern.subn(
              preview_replacement,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'preview cuisines: expected one match, found {count}')

          replace_once(
              "        CUISINES.filter(",
              "        cuisines.filter(",
              'selected cuisine source',
          )

          replace_once(
              "                  (cuisine) =>\n                    cuisine.keywords.some(",
              "                  (cuisine) =>\n                    cuisine.storeIds.includes(\n                      store.id,\n                    ) ||\n                    cuisine.keywords.some(",
              'store cuisine matching',
          )

          replace_once(
              "    }, [\n      selectedCuisineKeys,\n      stores,\n    ]);",
              "    }, [\n      cuisines,\n      selectedCuisineKeys,\n      stores,\n    ]);",
              'visible store dependencies',
          )

          replace_once(
              "                keywords: [],\n              }}",
              "                keywords: [],\n                storeIds: [],\n              }}",
              'view all cuisine type',
          )

          replace_once(
              "      <CuisinesModal\n        draftCuisineKeys=",
              "      <CuisinesModal\n        cuisines={cuisines}\n        draftCuisineKeys=",
              'modal cuisines prop',
          )

          replace_once(
              "function CuisinesModal({\n  draftCuisineKeys,",
              "function CuisinesModal({\n  cuisines,\n  draftCuisineKeys,",
              'modal cuisine argument',
          )

          replace_once(
              "}: {\n  draftCuisineKeys: string[];",
              "}: {\n  cuisines: CuisineItem[];\n  draftCuisineKeys: string[];",
              'modal cuisine prop type',
          )

          replace_once(
              "            {CUISINES.map(",
              "            {cuisines.map(",
              'modal cuisine source',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Commit patched screen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/category/restaurants.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Make restaurant cuisines database driven"
          git push origin HEAD:fix/database-driven-restaurant-cuisines
