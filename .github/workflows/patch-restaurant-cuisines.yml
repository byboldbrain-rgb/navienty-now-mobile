name: Patch restaurant cuisines screen

on:
  push:
    branches:
      - fix/database-driven-restaurant-cuisines
    paths:
      - .github/workflows/patch-restaurant-cuisines.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch restaurants screen
        run: python .github/scripts/patch_restaurant_cuisines.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck changed files
        shell: bash
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee /tmp/tsc.log
          tsc_status=${PIPESTATUS[0]}
          set -e

          if grep -E "src/(app/category/restaurants\.tsx|services/restaurant-cuisines-service\.ts)" /tmp/tsc.log; then
            echo "TypeScript errors found in the restaurant cuisine changes."
            exit 1
          fi

          if [ "$tsc_status" -ne 0 ]; then
            echo "::warning::Repository has pre-existing TypeScript errors outside the changed restaurant cuisine files."
          fi

      - name: Commit patched screen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/category/restaurants.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Make restaurant cuisines database driven"
          git push origin HEAD:fix/database-driven-restaurant-cuisines
