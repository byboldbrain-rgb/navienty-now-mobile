name: Migrate images to Expo Image once

on:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/migrate-expo-image-once.yml

permissions:
  contents: write

jobs:
  migrate-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: cto/launch-readiness-hardening
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate React Native Image to cached Expo Image
        run: node scripts/migrate-images-to-expo-image.mjs

      - name: Type-check migrated source
        run: npx tsc --noEmit

      - name: Commit migrated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src

          if git diff --cached --quiet; then
            echo "No image component changes were needed."
            exit 0
          fi

          git commit -m "Use cached Expo Image across app"
          git push origin HEAD:cto/launch-readiness-hardening
