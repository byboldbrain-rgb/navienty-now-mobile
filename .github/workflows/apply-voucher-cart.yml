name: Apply voucher cart migration

on:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/apply-voucher-cart.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: cto/launch-readiness-hardening
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply voucher migration
        run: python scripts/apply-voucher-cart-migration.py

      - name: Commit voucher migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Move voucher entry from checkout to cart"
          git push origin HEAD:cto/launch-readiness-hardening
