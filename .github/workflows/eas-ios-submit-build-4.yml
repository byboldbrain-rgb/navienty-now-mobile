name: Submit EAS iOS build 4 to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - codex/app-store-launch-readiness
    paths:
      - .github/workflows/eas-ios-submit-build-4.yml

permissions:
  contents: read

jobs:
  submit_build_4:
    name: Submit build 4 to TestFlight
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'Submit iOS build 4 to TestFlight'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_BUILD_ID: f9cd19a1-69c6-4959-9211-08d7ebffee8a

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Require Expo access token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured."
            exit 1
          fi

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install project dependencies
        run: npm ci

      - name: Schedule existing build for TestFlight
        shell: bash
        run: |
          eas submit \
            --platform ios \
            --id "$EAS_BUILD_ID" \
            --profile production \
            --non-interactive \
            --no-wait
