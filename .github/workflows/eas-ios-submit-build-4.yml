name: Submit EAS iOS build 4 to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - codex/app-store-launch-readiness
    paths:
      - .github/workflows/eas-ios-submit-build-4.yml

permissions:
  contents: read

jobs:
  submit_build_4:
    name: Wait for build 4 and submit to TestFlight
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'Submit iOS build 4 to TestFlight'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_BUILD_ID: f9cd19a1-69c6-4959-9211-08d7ebffee8a

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Require Expo access token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured."
            exit 1
          fi

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Wait for EAS build and submit
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 120); do
            build_json="$(eas build:view "$EAS_BUILD_ID" --json)"
            status="$(jq -r '.status' <<<"$build_json")"
            normalized_status="$(tr '[:upper:]_' '[:lower:]-' <<<"$status" | tr -d '[:space:]')"
            echo "EAS build status: $status"

            case "$normalized_status" in
              finished)
                break
                ;;
              errored|canceled)
                echo "EAS build ended with status: $status"
                exit 1
                ;;
            esac

            if [ "$attempt" -eq 120 ]; then
              echo "Timed out waiting for EAS build."
              exit 1
            fi

            sleep 30
          done

          eas submit \
            --platform ios \
            --id "$EAS_BUILD_ID" \
            --profile production \
            --non-interactive \
            --no-wait
