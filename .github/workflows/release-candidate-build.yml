name: Release Candidate Builds

on:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/release-candidate-build.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: '1'

jobs:
  build:
    name: EAS preview / ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - android
          - ios

    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured in this repository's GitHub Actions secrets."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate release candidate source
        run: |
          npx expo-doctor@latest
          npm run audit:prod
          npm test
          npx tsc --noEmit
          npm run lint

      - name: Build EAS preview binary
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          npx eas-cli@latest build
          --platform ${{ matrix.platform }}
          --profile preview
          --non-interactive
          --wait
