name: Patch Checkout Handoff

on:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/patch-checkout-handoff.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v5
        with:
          ref: cto/launch-readiness-hardening
          fetch-depth: 0

      - name: Keep checkout inside the app until explicit WhatsApp handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          checkout_path = Path('src/app/checkout.tsx')
          confirmation_path = Path('src/app/order-confirmation.tsx')
          ci_path = Path('.github/workflows/ci.yml')
          guard_path = Path('scripts/validate-checkout-handoff.mjs')

          checkout = checkout_path.read_text()
          confirmation = confirmation_path.read_text()
          ci = ci_path.read_text()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          # Checkout: creation remains in-app; WhatsApp moves to confirmation screen.
          checkout = replace_once(
              checkout,
              "import {\n  cancelPendingWhatsAppOrder,\n  confirmWhatsAppOrderSent,\n  createWhatsAppOrder,\n} from '../services/order-service';",
              "import {\n  cancelPendingWhatsAppOrder,\n  createWhatsAppOrder,\n} from '../services/order-service';",
              'checkout order-service import',
          )

          checkout = replace_once(
              checkout,
              "\nimport {\n  openOrderInWhatsApp,\n} from '../utils/order-whatsapp';\n",
              "\n",
              'checkout WhatsApp import',
          )

          checkout = replace_once(
              checkout,
              "\n  const clearCart =\n    useCartStore(\n      (state) =>\n        state.clearCart,\n    );\n",
              "\n",
              'checkout clearCart selector',
          )

          checkout = replace_once(
              checkout,
              "\n  const confirmPendingOrder =\n    useOrdersStore(\n      (state) =>\n        state.confirmPendingOrder,\n    );\n",
              "\n",
              'checkout confirmPendingOrder selector',
          )

          checkout = checkout.replace('isOpeningWhatsApp', 'isSubmittingOrder')
          checkout = checkout.replace('setIsOpeningWhatsApp', 'setIsSubmittingOrder')
          checkout = checkout.replace('sendOrderToWhatsApp', 'submitOrder')

          handoff_start_marker = '''      /*\n       * We cannot read WhatsApp's internal "message sent" state.'''
          handoff_start = checkout.find(handoff_start_marker)
          if handoff_start < 0:
              raise SystemExit('checkout automatic WhatsApp handoff start marker not found')

          outer_catch_marker = '    } catch (error) {'
          handoff_end = checkout.find(outer_catch_marker, handoff_start)
          if handoff_end < 0:
              raise SystemExit('checkout outer catch marker not found')

          replacement = '''      /*\n       * Keep the checkout flow inside Navienty Now. The order now exists\n       * as a pending order, but opening WhatsApp is a separate, explicit\n       * customer action on /order-confirmation.\n       */\n      createdOrder = null;\n\n      router.replace(\n        '/order-confirmation',\n      );\n'''
          checkout = checkout[:handoff_start] + replacement + checkout[handoff_end:]

          checkout = checkout.replace("'whatsapp_open_failed'", "'checkout_create_failed'")
          checkout = checkout.replace("'تعذر إنشاء الطلب أو فتح واتساب.'", "'تعذر إنشاء الطلب.'")

          checkout = replace_once(
              checkout,
              '''              بعد الضغط على إرسال\n              الطلب سيتم فتح واتساب\n              برسالة جاهزة لتأكيد الأوردر\n              وطريقة الدفع التي اخترتها.\n              اضغط إرسال داخل واتساب\n              وانتظر تأكيد فريق{' '}\n              {appName}.''',
              '''              بعد الضغط على متابعة سيتم\n              إنشاء الطلب داخل {appName}\n              أولًا. في الشاشة التالية\n              يمكنك فتح واتساب برسالة\n              جاهزة عندما تكون مستعدًا.''',
              'checkout WhatsApp notice copy',
          )

          checkout = replace_once(
              checkout,
              '''              <Ionicons\n                name="logo-whatsapp"\n                size={22}\n                color="#ffffff"\n              />''',
              '''              <Ionicons\n                name="checkmark-circle-outline"\n                size={22}\n                color="#ffffff"\n              />''',
              'checkout submit icon',
          )

          checkout = replace_once(
              checkout,
              '''              إرسال الطلب''',
              '''              متابعة''',
              'checkout submit label',
          )

          # Confirmation: explicit WhatsApp opening lives here.
          confirmation = replace_once(
              confirmation,
              "import { useOrdersStore } from '../store/orders-store';\n",
              "import { useOrdersStore } from '../store/orders-store';\nimport { openOrderInWhatsApp } from '../utils/order-whatsapp';\n",
              'confirmation WhatsApp import',
          )

          confirmation = replace_once(
              confirmation,
              '''  const [isCancelling, setIsCancelling] =\n    useState(false);\n''',
              '''  const [isCancelling, setIsCancelling] =\n    useState(false);\n\n  const [isOpeningWhatsApp, setIsOpeningWhatsApp] =\n    useState(false);\n''',
              'confirmation WhatsApp state',
          )

          confirmation = confirmation.replace(
              '''      isConfirming ||\n      isCancelling ||''',
              '''      isConfirming ||\n      isCancelling ||\n      isOpeningWhatsApp ||''',
          )
          confirmation = confirmation.replace(
              '''      isConfirming ||\n      isCancelling\n    )''',
              '''      isConfirming ||\n      isCancelling ||\n      isOpeningWhatsApp\n    )''',
          )

          insert_before = '  async function confirmOrderWasSent() {'
          if confirmation.count(insert_before) != 1:
              raise SystemExit('confirmation confirmOrderWasSent marker mismatch')
          explicit_open = '''  async function openWhatsAppForPendingOrder() {\n    if (\n      isOpeningWhatsApp ||\n      isConfirming ||\n      isCancelling ||\n      !pendingOrder\n    ) {\n      return;\n    }\n\n    try {\n      setIsOpeningWhatsApp(true);\n\n      await openOrderInWhatsApp(\n        pendingOrder,\n      );\n    } catch (error) {\n      const message =\n        error instanceof Error\n          ? error.message\n          : 'تعذر فتح واتساب.';\n\n      Alert.alert(\n        'تعذر فتح واتساب',\n        message,\n      );\n    } finally {\n      setIsOpeningWhatsApp(false);\n    }\n  }\n\n'''
          confirmation = confirmation.replace(insert_before, explicit_open + insert_before, 1)

          confirmation = replace_once(
              confirmation,
              '''              تأكيد إرسال الطلب''',
              '''              تأكيد الطلب''',
              'confirmation title',
          )
          confirmation = replace_once(
              confirmation,
              '''              أخبرنا هل أرسلت الرسالة على\n              واتساب''',
              '''              أكمل خطوة واتساب عندما تكون جاهزًا''',
              'confirmation subtitle',
          )
          confirmation = replace_once(
              confirmation,
              '''            هل أرسلت رسالة الطلب؟''',
              '''            طلبك جاهز للتأكيد''',
              'confirmation hero title',
          )
          confirmation = replace_once(
              confirmation,
              '''            فتح واتساب لا يعني أن الرسالة\n            تم إرسالها. اضغط على الخيار\n            الصحيح حتى لا نفقد محتويات\n            السلة بالخطأ.''',
              '''            افتح الرسالة الجاهزة على واتساب،\n            وبعد إرسالها ارجع إلى Navienty Now\n            واضغط «تم إرسال الطلب».''',
              'confirmation hero description',
          )

          warning_marker = '        <View style={styles.warningCard}>'
          if confirmation.count(warning_marker) != 1:
              raise SystemExit('confirmation warning marker mismatch')
          whatsapp_button = '''        <Pressable\n          style={({ pressed }) => [\n            styles.whatsAppButton,\n            (isOpeningWhatsApp ||\n              isConfirming ||\n              isCancelling) &&\n              styles.confirmButtonDisabled,\n            pressed &&\n              !isOpeningWhatsApp &&\n              !isConfirming &&\n              !isCancelling &&\n              styles.confirmButtonPressed,\n          ]}\n          disabled={\n            isOpeningWhatsApp ||\n            isConfirming ||\n            isCancelling\n          }\n          onPress={() => {\n            void openWhatsAppForPendingOrder();\n          }}\n        >\n          <View\n            style={\n              styles.confirmButtonIconContainer\n            }\n          >\n            {isOpeningWhatsApp ? (\n              <ActivityIndicator\n                color="#25a952"\n                size="small"\n              />\n            ) : (\n              <Text\n                style={\n                  styles.whatsAppButtonIcon\n                }\n              >\n                💬\n              </Text>\n            )}\n          </View>\n\n          <View\n            style={\n              styles.confirmButtonContent\n            }\n          >\n            <Text\n              style={\n                styles.confirmButtonText\n              }\n            >\n              متابعة عبر واتساب\n            </Text>\n\n            <Text\n              style={\n                styles.confirmButtonDescription\n              }\n            >\n              فتح الرسالة الجاهزة في واتساب\n            </Text>\n          </View>\n        </Pressable>\n\n'''
          confirmation = confirmation.replace(warning_marker, whatsapp_button + warning_marker, 1)

          confirmation = replace_once(
              confirmation,
              '''            styles.confirmButton,\n            (isConfirming ||\n              isCancelling) &&''',
              '''            styles.sentButton,\n            (isConfirming ||\n              isCancelling ||\n              isOpeningWhatsApp) &&''',
              'confirmation sent button style',
          )
          confirmation = confirmation.replace(
              'disabled={isConfirming || isCancelling}',
              'disabled={isConfirming || isCancelling || isOpeningWhatsApp}',
          )
          confirmation = confirmation.replace(
              '''              !isConfirming &&\n              !isCancelling &&\n              styles.confirmButtonPressed,''',
              '''              !isConfirming &&\n              !isCancelling &&\n              !isOpeningWhatsApp &&\n              styles.confirmButtonPressed,''',
          )

          confirmation = replace_once(
              confirmation,
              '''              لم أرسل الطلب بعد''',
              '''              العودة لبيانات الطلب''',
              'confirmation back label',
          )
          confirmation = replace_once(
              confirmation,
              '''              العودة لبيانات التوصيل مع\n              الاحتفاظ بالسلة''',
              '''              إلغاء الطلب المعلّق والرجوع\n              إلى Checkout مع الاحتفاظ بالسلة''',
              'confirmation back description',
          )

          style_marker = '''  confirmButton: {\n    alignItems: 'center','''
          if confirmation.count(style_marker) != 1:
              raise SystemExit('confirmation confirmButton style marker mismatch')
          new_styles = '''  whatsAppButton: {\n    alignItems: 'center',\n    backgroundColor: '#25d366',\n    borderRadius: 20,\n    flexDirection: 'row',\n    marginTop: 24,\n    minHeight: 76,\n    padding: 14,\n  },\n\n  whatsAppButtonIcon: {\n    fontSize: 21,\n  },\n\n  sentButton: {\n    alignItems: 'center',\n    backgroundColor: '#6d56df',\n    borderRadius: 20,\n    flexDirection: 'row',\n    marginTop: 12,\n    minHeight: 76,\n    padding: 14,\n  },\n\n'''
          confirmation = confirmation.replace(style_marker, new_styles + style_marker, 1)
          confirmation = confirmation.replace("    marginTop: 24,\n    minHeight: 76,\n    padding: 14,\n  },\n\n  confirmButtonDisabled:", "    marginTop: 12,\n    minHeight: 76,\n    padding: 14,\n  },\n\n  confirmButtonDisabled:", 1)

          # Permanent regression guard.
          guard = r'''import { readFileSync } from 'node:fs';

const checkout = readFileSync('src/app/checkout.tsx', 'utf8');
const confirmation = readFileSync('src/app/order-confirmation.tsx', 'utf8');

const failures = [];

if (checkout.includes('openOrderInWhatsApp(')) {
  failures.push('checkout must not open WhatsApp directly');
}

if (checkout.includes('Linking.openURL(')) {
  failures.push('checkout must not call Linking.openURL directly');
}

if (!checkout.includes("router.replace(\n        '/order-confirmation',\n      );")) {
  failures.push('checkout must route to /order-confirmation after creating the pending order');
}

if (!confirmation.includes('openOrderInWhatsApp(')) {
  failures.push('order-confirmation must own the explicit WhatsApp handoff');
}

if (!confirmation.includes('متابعة عبر واتساب')) {
  failures.push('order-confirmation must expose an explicit WhatsApp action');
}

if (failures.length > 0) {
  console.error('Checkout handoff validation failed:');
  for (const failure of failures) {
    console.error(`- ${failure}`);
  }
  process.exit(1);
}

console.log('Checkout handoff validation passed.');
'''
          guard_path.write_text(guard)

          ci_insert = '''      - name: Validate release config\n        run: node scripts/validate-release-config.mjs\n'''
          if ci.count(ci_insert) != 1:
              raise SystemExit('Mobile CI release-config step mismatch')
          ci = ci.replace(
              ci_insert,
              ci_insert + '''\n      - name: Validate checkout handoff\n        run: node scripts/validate-checkout-handoff.mjs\n''',
              1,
          )

          checkout_path.write_text(checkout)
          confirmation_path.write_text(confirmation)
          ci_path.write_text(ci)
          PY

      - name: Run focused validation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-checkout-handoff.mjs
          grep -q "'/order-confirmation'" src/app/checkout.tsx
          ! grep -q 'openOrderInWhatsApp' src/app/checkout.tsx
          grep -q 'متابعة عبر واتساب' src/app/order-confirmation.tsx

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/checkout.tsx src/app/order-confirmation.tsx scripts/validate-checkout-handoff.mjs .github/workflows/ci.yml
          git commit -m 'fix: keep checkout in app before WhatsApp handoff'
          git pull --rebase origin cto/launch-readiness-hardening
          git push origin HEAD:cto/launch-readiness-hardening
