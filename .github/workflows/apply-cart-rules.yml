name: Apply Cart Business Rules

on:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/apply-cart-rules.yml
      - scripts/apply-cart-rules-hardening.mjs
      - src/domain/cart-rules.ts
      - tests/cart-rules.test.mjs

permissions:
  contents: write

env:
  CI: '1'

jobs:
  harden:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v5
        with:
          ref: cto/launch-readiness-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact source patch
        run: node scripts/apply-cart-rules-hardening.mjs

      - name: Business-rule tests
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production dependency audit policy
        run: npm run audit:prod

      - name: Show source diff
        run: git diff -- src/store/cart-store.ts

      - name: Commit verified cart-rule hardening
        run: |
          if git diff --quiet -- src/store/cart-store.ts; then
            echo "No cart-store changes to commit."
            exit 0
          fi
          git config user.name "Navienty CTO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/store/cart-store.ts
          git commit -m "test: bind cart store to tested business rules"
          git push origin HEAD:cto/launch-readiness-hardening
