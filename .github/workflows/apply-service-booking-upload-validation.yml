name: Apply Service Booking Upload Validation

on:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/apply-service-booking-upload-validation.yml
      - scripts/apply-service-booking-upload-validation.mjs

permissions:
  contents: write

env:
  CI: '1'

jobs:
  harden:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v5
        with:
          ref: cto/launch-readiness-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact source patch
        run: node scripts/apply-service-booking-upload-validation.mjs

      - name: Business/security tests
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production dependency audit policy
        run: npm run audit:prod

      - name: Show source diff
        run: git diff -- src/services/service-booking-payment-proof-service.ts

      - name: Commit verified service-booking upload hardening
        run: |
          if git diff --quiet -- src/services/service-booking-payment-proof-service.ts; then
            echo "No service-booking upload changes to commit."
            exit 0
          fi
          git config user.name "Navienty CTO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/services/service-booking-payment-proof-service.ts
          git commit -m "security: validate service booking proof signatures"
          git push origin HEAD:cto/launch-readiness-hardening
