name: Apply order notes cart migration

on:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/apply-order-notes-cart.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: cto/launch-readiness-hardening
          fetch-depth: 0

      - name: Apply migration
        run: python3 scripts/apply-order-notes-cart.py

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move order notes from checkout to cart"
          git push origin cto/launch-readiness-hardening
