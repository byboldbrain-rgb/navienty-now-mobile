name: Probe Current Android RC Once

on:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/probe-current-android-rc-once.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      TARGET_BUILD_COMMIT: 37d383acffcbca9d6f25df571a454035ead72f8f

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v5
        with:
          ref: cto/launch-readiness-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo project config
        run: npx expo config --json > /tmp/expo-config.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Refresh current Android RC status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/rc-status

          build_id=''
          for attempt in $(seq 1 30); do
            eas build:list \
              --platform android \
              --build-profile preview \
              --git-commit-hash "$TARGET_BUILD_COMMIT" \
              --limit 1 \
              --json > build-list.json
            build_id="$(jq -r 'if length > 0 then .[0].id else empty end' build-list.json)"
            if [ -n "$build_id" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$build_id" ]; then
            jq -n --arg target "$TARGET_BUILD_COMMIT" '{targetCommit:$target,found:false,status:"NOT_FOUND"}' > .github/rc-status/android-current-once.json
          else
            eas build:view "$build_id" --json > build.json
            jq --arg target "$TARGET_BUILD_COMMIT" '{
              targetCommit: $target,
              found: true,
              id: .id,
              status: .status,
              platform: .platform,
              buildProfile: .buildProfile,
              artifactUrl: (.artifacts.buildUrl // .artifacts.applicationArchiveUrl // null),
              errorCode: (.error.errorCode // .error.code // .errorCode // null),
              errorMessage: (.error.message // .error.errorMessage // .errorMessage // null)
            }' build.json > .github/rc-status/android-current-once.json
          fi

      - name: Commit query result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/rc-status/android-current-once.json
          git commit -m 'ci: refresh Android RC #3 current status' || exit 0
          git pull --rebase origin cto/launch-readiness-hardening
          git push origin HEAD:cto/launch-readiness-hardening
