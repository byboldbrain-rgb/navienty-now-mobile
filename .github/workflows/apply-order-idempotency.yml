name: Apply Checkout Idempotency Hardening

on:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/apply-order-idempotency.yml
      - scripts/apply-order-idempotency-hardening.mjs
      - src/domain/order-idempotency.ts
      - tests/order-idempotency.test.mjs
      - package.json

permissions:
  contents: write

env:
  CI: '1'

jobs:
  harden:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v5
        with:
          ref: cto/launch-readiness-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact source patch
        run: node scripts/apply-order-idempotency-hardening.mjs

      - name: Business-rule tests
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production dependency audit policy
        run: npm run audit:prod

      - name: Show source diff
        run: git diff -- src/services/order-service.ts

      - name: Commit verified idempotency hardening
        run: |
          if git diff --quiet -- src/services/order-service.ts; then
            echo "No order-service changes to commit."
            exit 0
          fi
          git config user.name "Navienty CTO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/services/order-service.ts
          git commit -m "fix: persist checkout idempotency across retries"
          git push origin HEAD:cto/launch-readiness-hardening
