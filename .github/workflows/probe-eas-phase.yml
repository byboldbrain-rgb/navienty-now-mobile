name: Probe EAS Phase

on:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/probe-eas-phase.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      TARGET_BUILD_COMMIT: be1fb4e6a02cefa1d24ae3694ceedaadac631ce8

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v5
        with:
          ref: cto/launch-readiness-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify EAS authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$EXPO_TOKEN" ]; then
            exit 2
          fi
          npx --yes eas-cli@latest whoami > /tmp/eas-whoami.txt

      - name: Query target Android build and capture outcome
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .github/rc-status

          set +e
          npx --yes eas-cli@latest build:list \
            --platform android \
            --build-profile preview \
            --git-commit-hash "$TARGET_BUILD_COMMIT" \
            --limit 1 \
            --json > /tmp/build-list.json 2> /tmp/build-list.err
          list_rc=$?
          set -e

          LIST_RC="$list_rc" python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          target = os.environ['TARGET_BUILD_COMMIT']
          rc = int(os.environ['LIST_RC'])
          output = Path('.github/rc-status/eas-phase.json')

          def clean(text: str) -> str:
              text = re.sub(r'https?://\S+', '[URL_REDACTED]', text)
              text = re.sub(r'\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b', '[EMAIL_REDACTED]', text)
              text = re.sub(r'(?i)(token|secret|password|api[_-]?key)\s*[:=]\s*\S+', r'\1=[REDACTED]', text)
              return text.strip()[:1600]

          if rc != 0:
              err = Path('/tmp/build-list.err').read_text(errors='replace') if Path('/tmp/build-list.err').exists() else ''
              output.write_text(json.dumps({
                  'phase': 'QUERY_ERROR',
                  'targetCommit': target,
                  'exitCode': rc,
                  'error': clean(err),
              }, ensure_ascii=False) + '\n')
              raise SystemExit(0)

          try:
              builds = json.loads(Path('/tmp/build-list.json').read_text())
          except Exception as exc:
              output.write_text(json.dumps({
                  'phase': 'QUERY_PARSE_ERROR',
                  'targetCommit': target,
                  'error': clean(str(exc)),
              }) + '\n')
              raise SystemExit(0)

          if not builds:
              output.write_text(json.dumps({
                  'phase': 'QUERY_OK',
                  'targetCommit': target,
                  'found': False,
                  'status': 'NOT_FOUND',
              }) + '\n')
              raise SystemExit(0)

          build = builds[0]
          output.write_text(json.dumps({
              'phase': 'QUERY_OK',
              'targetCommit': target,
              'found': True,
              'id': build.get('id'),
              'status': build.get('status'),
              'platform': build.get('platform'),
              'buildProfile': build.get('buildProfile'),
          }) + '\n')
          PY

          build_id="$(jq -r 'if (.found == true) then (.id // empty) else empty end' .github/rc-status/eas-phase.json)"
          if [ -n "$build_id" ]; then
            set +e
            npx --yes eas-cli@latest build:view "$build_id" --json > /tmp/build.json 2> /tmp/build-view.err
            view_rc=$?
            set -e
            if [ "$view_rc" -eq 0 ]; then
              jq --arg phase 'QUERY_OK' --arg target "$TARGET_BUILD_COMMIT" '{phase:$phase,targetCommit:$target,found:true,id:.id,status:.status,platform:.platform,buildProfile:.buildProfile,artifactUrl:(.artifacts.buildUrl // .artifacts.applicationArchiveUrl // null),errorCode:(.error.errorCode // .error.code // .errorCode // null),errorMessage:(.error.message // .error.errorMessage // .errorMessage // null)}' /tmp/build.json > .github/rc-status/eas-phase.json
            fi
          fi

      - name: Commit captured outcome
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/rc-status/eas-phase.json
          git commit -m 'ci: record EAS Android query outcome' || exit 0
          git pull --rebase origin cto/launch-readiness-hardening
          git push origin HEAD:cto/launch-readiness-hardening
