name: Probe EAS Phase

on:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/probe-eas-phase.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_BUILD_COMMIT: 37d383acffcbca9d6f25df571a454035ead72f8f
      TARGET_PR: '2'

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v5
        with:
          ref: cto/launch-readiness-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Verify Expo project config
        run: npx expo config --json > /tmp/expo-config.json

      - name: Verify EAS authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@latest whoami > /tmp/eas-whoami.txt

      - name: Track target Android build to terminal status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/rc-status

          build_id=''
          for attempt in $(seq 1 90); do
            npx --yes eas-cli@latest build:list \
              --platform android \
              --build-profile preview \
              --git-commit-hash "$TARGET_BUILD_COMMIT" \
              --limit 1 \
              --json > /tmp/build-list.json
            build_id="$(jq -r 'if length > 0 then .[0].id else empty end' /tmp/build-list.json)"
            if [ -n "$build_id" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$build_id" ]; then
            jq -n --arg target "$TARGET_BUILD_COMMIT" '{phase:"NOT_FOUND",targetCommit:$target,found:false}' > .github/rc-status/eas-phase.json
            gh pr comment "$TARGET_PR" --body "Android RC tracker could not find an EAS preview build for commit \`$TARGET_BUILD_COMMIT\`."
            exit 1
          fi

          dashboard="https://expo.dev/accounts/navientynows-team/projects/navienty-now/builds/$build_id"
          initial_status="$(jq -r '.[0].status' /tmp/build-list.json)"
          gh pr comment "$TARGET_PR" --body "### Android RC #3 detected
- Commit: \`$TARGET_BUILD_COMMIT\`
- EAS Build ID: \`$build_id\`
- Initial status: \`$initial_status\`
- Dashboard: $dashboard"

          raw_status="$initial_status"
          normalized="$(printf '%s' "$raw_status" | tr '[:upper:]' '[:lower:]')"
          for attempt in $(seq 1 120); do
            npx --yes eas-cli@latest build:view "$build_id" --json > /tmp/build.json
            raw_status="$(jq -r '.status' /tmp/build.json)"
            normalized="$(printf '%s' "$raw_status" | tr '[:upper:]' '[:lower:]')"
            case "$normalized" in
              finished|errored|canceled)
                break
                ;;
            esac
            sleep 15
          done

          artifact="$(jq -r '.artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty' /tmp/build.json)"
          error_code="$(jq -r '.error.errorCode // .error.code // .errorCode // empty' /tmp/build.json)"
          error_message="$(jq -r '.error.message // .error.errorMessage // .errorMessage // empty' /tmp/build.json)"

          jq -n \
            --arg target "$TARGET_BUILD_COMMIT" \
            --arg id "$build_id" \
            --arg status "$raw_status" \
            --arg artifact "$artifact" \
            --arg errorCode "$error_code" \
            --arg errorMessage "$error_message" \
            '{phase:"TERMINAL",targetCommit:$target,found:true,id:$id,status:$status,platform:"ANDROID",buildProfile:"preview",artifactUrl:(if $artifact=="" then null else $artifact end),errorCode:(if $errorCode=="" then null else $errorCode end),errorMessage:(if $errorMessage=="" then null else $errorMessage end)}' \
            > .github/rc-status/eas-phase.json

          cat > /tmp/final.md <<EOF
          ### Android RC #3 final status
          - Commit: \`$TARGET_BUILD_COMMIT\`
          - EAS Build ID: \`$build_id\`
          - Status: \`$raw_status\`
          - Dashboard: $dashboard
          - Install artifact: ${artifact:-not returned}
          - Error code: ${error_code:-none}
          - Error message: ${error_message:-none}

          Physical Android smoke testing remains required. iOS remains blocked on Apple Developer Program membership.
          EOF
          gh pr comment "$TARGET_PR" --body-file /tmp/final.md

          if [ "$normalized" != 'finished' ]; then
            exit 1
          fi

      - name: Commit captured outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/rc-status/eas-phase.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/rc-status/eas-phase.json
          git commit -m 'ci: record Android RC #3 terminal status' || exit 0
          git pull --rebase origin cto/launch-readiness-hardening
          git push origin HEAD:cto/launch-readiness-hardening
