name: Apply prescription client

on:
  push:
    branches:
      - agent/p0-launch-hardening
    paths:
      - .github/workflows/apply-prescription-client.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/p0-launch-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply pharmacy client changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              text = file_path.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'{path}: expected snippet not found: {old[:160]!r}')
              file_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # ---------------------------------------------------------------
          # Prescription service: recover an already-submitted draft after
          # app restart and attach it idempotently to a newly-created order.
          # ---------------------------------------------------------------
          replace_once(
              'src/services/prescription-service.ts',
              "export async function cancelMyPrescriptionSubmission(\n",
              "export async function getMyOpenPrescriptionSubmission(\n"
              "  storeId: string,\n"
              "): Promise<PrescriptionSubmission | null> {\n"
              "  await ensureAppSession();\n\n"
              "  const { data, error } =\n"
              "    await supabase.rpc(\n"
              "      'get_my_open_prescription_submission',\n"
              "      {\n"
              "        p_store_id: storeId,\n"
              "      },\n"
              "    );\n\n"
              "  if (error) {\n"
              "    throw new Error(\n"
              "      getPrescriptionErrorMessage(error),\n"
              "    );\n"
              "  }\n\n"
              "  return data == null\n"
              "    ? null\n"
              "    : mapPrescriptionSubmission(\n"
              "        data,\n"
              "      );\n"
              "}\n\n"
              "export async function attachPrescriptionToOrder(\n"
              "  orderId: string,\n"
              "  submissionId: string,\n"
              "): Promise<void> {\n"
              "  const { error } =\n"
              "    await supabase.rpc(\n"
              "      'attach_prescription_to_order',\n"
              "      {\n"
              "        p_order_id: orderId,\n"
              "        p_submission_id:\n"
              "          submissionId,\n"
              "      },\n"
              "    );\n\n"
              "  if (error) {\n"
              "    throw new Error(\n"
              "      getPrescriptionErrorMessage(error),\n"
              "    );\n"
              "  }\n"
              "}\n\n"
              "export async function cancelMyPrescriptionSubmission(\n",
          )

          # ---------------------------------------------------------------
          # Persist compliance flags with each cart line. Legacy carts are
          # normalized to false so the state migration remains backwards-safe.
          # ---------------------------------------------------------------
          replace_once(
              'src/store/cart-store.ts',
              "  variantName?: string | null;\n};",
              "  variantName?: string | null;\n\n"
              "  requiresPrescription?: boolean;\n"
              "  isAgeRestricted?: boolean;\n};",
          )
          replace_once(
              'src/store/cart-store.ts',
              "  variantId: string | null;\n  variantName: string | null;\n};",
              "  variantId: string | null;\n"
              "  variantName: string | null;\n"
              "  requiresPrescription: boolean;\n"
              "  isAgeRestricted: boolean;\n};",
          )
          replace_once(
              'src/store/cart-store.ts',
              "    variantName:\n      normalizeVariantName(\n        product.variantName,\n      ),\n  };",
              "    variantName:\n      normalizeVariantName(\n        product.variantName,\n      ),\n\n"
              "    requiresPrescription:\n"
              "      product.requiresPrescription === true,\n\n"
              "    isAgeRestricted:\n"
              "      product.isAgeRestricted === true,\n"
              "  };",
          )
          replace_once(
              'src/store/cart-store.ts',
              "    variantName:\n      normalizeVariantName(\n        item.variantName,\n      ),\n  };",
              "    variantName:\n      normalizeVariantName(\n        item.variantName,\n      ),\n\n"
              "    requiresPrescription:\n"
              "      item.requiresPrescription === true,\n\n"
              "    isAgeRestricted:\n"
              "      item.isAgeRestricted === true,\n"
              "  };",
          )

          # Pharmacy home and category screens.
          replace_once(
              'src/app/category/pharmacy.tsx',
              "        variantName: null,\n      },\n    );",
              "        variantName: null,\n"
              "        requiresPrescription:\n"
              "          product.requiresPrescription,\n"
              "        isAgeRestricted:\n"
              "          product.isAgeRestricted,\n"
              "      },\n    );",
          )
          replace_once(
              'src/app/pharmacy-category/[slug].tsx',
              "        variantName:\n          null,\n      },\n    );",
              "        variantName:\n          null,\n\n"
              "        requiresPrescription:\n"
              "          product.requiresPrescription,\n\n"
              "        isAgeRestricted:\n"
              "          product.isAgeRestricted,\n"
              "      },\n    );",
          )

          # General store screen may also render pharmacy catalogs.
          replace_once(
              'src/app/store/[id].tsx',
              "      variantName:\n        variant?.name ?? null,\n    };",
              "      variantName:\n        variant?.name ?? null,\n\n"
              "      requiresPrescription:\n"
              "        product.requiresPrescription,\n\n"
              "      isAgeRestricted:\n"
              "        product.isAgeRestricted,\n"
              "    };",
          )
          replace_once(
              'src/app/store/[id].tsx',
              "        variantId: null,\n        variantName: null,\n      },\n    );",
              "        variantId: null,\n"
              "        variantName: null,\n"
              "        requiresPrescription:\n"
              "          product.requiresPrescription,\n"
              "        isAgeRestricted:\n"
              "          product.isAgeRestricted,\n"
              "      },\n    );",
          )

          # ---------------------------------------------------------------
          # Checkout: imports.
          # ---------------------------------------------------------------
          replace_once(
              'src/app/checkout.tsx',
              "import {\n  cancelPendingWhatsAppOrder,\n  confirmWhatsAppOrderSent,\n  createWhatsAppOrder,\n} from '../services/order-service';\n",
              "import {\n  cancelPendingWhatsAppOrder,\n  confirmWhatsAppOrderSent,\n  createWhatsAppOrder,\n} from '../services/order-service';\n\n"
              "import {\n"
              "  attachPrescriptionToOrder,\n"
              "  getMyOpenPrescriptionSubmission,\n"
              "  pickAndUploadPrescription,\n"
              "  type PrescriptionSubmission,\n"
              "} from '../services/prescription-service';\n",
          )

          # Checkout: cart compliance state derived from server catalog snapshots.
          replace_once(
              'src/app/checkout.tsx',
              "  const storeIcon =\n    checkoutCart?.storeIcon ??\n    null;\n\n  const itemCount =",
              "  const storeIcon =\n    checkoutCart?.storeIcon ??\n    null;\n\n"
              "  const isPharmacyCart =\n"
              "    checkoutCart?.categorySlug ===\n"
              "      'pharmacy';\n\n"
              "  const requiresPrescription =\n"
              "    isPharmacyCart &&\n"
              "    items.some(\n"
              "      (item) =>\n"
              "        item.requiresPrescription,\n"
              "    );\n\n"
              "  const hasAgeRestrictedItems =\n"
              "    isPharmacyCart &&\n"
              "    items.some(\n"
              "      (item) =>\n"
              "        item.isAgeRestricted,\n"
              "    );\n\n"
              "  const itemCount =",
          )

          # Checkout: local prescription state.
          replace_once(
              'src/app/checkout.tsx',
              "  const [\n    storeImageFailed,\n    setStoreImageFailed,\n  ] = useState(false);\n",
              "  const [\n    storeImageFailed,\n    setStoreImageFailed,\n  ] = useState(false);\n\n"
              "  const [\n"
              "    prescriptionSubmission,\n"
              "    setPrescriptionSubmission,\n"
              "  ] = useState<PrescriptionSubmission | null>(\n"
              "    null,\n"
              "  );\n\n"
              "  const [\n"
              "    prescriptionFileName,\n"
              "    setPrescriptionFileName,\n"
              "  ] = useState<string | null>(null);\n\n"
              "  const [\n"
              "    isLoadingPrescription,\n"
              "    setIsLoadingPrescription,\n"
              "  ] = useState(false);\n\n"
              "  const [\n"
              "    isUploadingPrescription,\n"
              "    setIsUploadingPrescription,\n"
              "  ] = useState(false);\n\n"
              "  const [\n"
              "    prescriptionError,\n"
              "    setPrescriptionError,\n"
              "  ] = useState<string | null>(null);\n",
          )

          # Checkout: recover already-submitted prescription after restart.
          replace_once(
              'src/app/checkout.tsx',
              "  }, [storeId]);\n\n  /* -------------------------------- */\n  /* DERIVED DATA                     */",
              "  }, [storeId]);\n\n"
              "  useEffect(() => {\n"
              "    let cancelled = false;\n\n"
              "    async function loadPrescription() {\n"
              "      if (\n"
              "        !requiresPrescription ||\n"
              "        !storeId\n"
              "      ) {\n"
              "        setPrescriptionSubmission(null);\n"
              "        setPrescriptionFileName(null);\n"
              "        setPrescriptionError(null);\n"
              "        setIsLoadingPrescription(false);\n"
              "        return;\n"
              "      }\n\n"
              "      try {\n"
              "        setIsLoadingPrescription(true);\n"
              "        setPrescriptionError(null);\n\n"
              "        const current =\n"
              "          await getMyOpenPrescriptionSubmission(\n"
              "            storeId,\n"
              "          );\n\n"
              "        if (!cancelled) {\n"
              "          setPrescriptionSubmission(current);\n"
              "          setPrescriptionFileName(\n"
              "            current?.status === 'submitted'\n"
              "              ? 'روشتة مرفوعة'\n"
              "              : null,\n"
              "          );\n"
              "        }\n"
              "      } catch (error) {\n"
              "        if (!cancelled) {\n"
              "          setPrescriptionError(\n"
              "            error instanceof Error\n"
              "              ? error.message\n"
              "              : 'تعذر تحميل حالة الروشتة.',\n"
              "          );\n"
              "        }\n"
              "      } finally {\n"
              "        if (!cancelled) {\n"
              "          setIsLoadingPrescription(false);\n"
              "        }\n"
              "      }\n"
              "    }\n\n"
              "    void loadPrescription();\n\n"
              "    return () => {\n"
              "      cancelled = true;\n"
              "    };\n"
              "  }, [\n"
              "    requiresPrescription,\n"
              "    storeId,\n"
              "  ]);\n\n"
              "  /* -------------------------------- */\n"
              "  /* DERIVED DATA                     */",
          )

          # Checkout: upload action before validation.
          replace_once(
              'src/app/checkout.tsx',
              "  /* -------------------------------- */\n  /* VALIDATION                       */",
              "  async function uploadPrescription() {\n"
              "    if (\n"
              "      !storeId ||\n"
              "      isUploadingPrescription\n"
              "    ) {\n"
              "      return;\n"
              "    }\n\n"
              "    try {\n"
              "      setIsUploadingPrescription(true);\n"
              "      setPrescriptionError(null);\n\n"
              "      const result =\n"
              "        await pickAndUploadPrescription(\n"
              "          storeId,\n"
              "        );\n\n"
              "      if (\n"
              "        result.status ===\n"
              "        'submitted'\n"
              "      ) {\n"
              "        setPrescriptionSubmission(\n"
              "          result.submission,\n"
              "        );\n"
              "        setPrescriptionFileName(\n"
              "          result.fileName,\n"
              "        );\n"
              "      }\n"
              "    } catch (error) {\n"
              "      setPrescriptionError(\n"
              "        error instanceof Error\n"
              "          ? error.message\n"
              "          : 'تعذر رفع الروشتة.',\n"
              "      );\n"
              "    } finally {\n"
              "      setIsUploadingPrescription(false);\n"
              "    }\n"
              "  }\n\n"
              "  const prescriptionIsReady =\n"
              "    !requiresPrescription ||\n"
              "    prescriptionSubmission?.status ===\n"
              "      'submitted' ||\n"
              "    prescriptionSubmission?.status ===\n"
              "      'approved';\n\n"
              "  /* -------------------------------- */\n"
              "  /* VALIDATION                       */",
          )

          replace_once(
              'src/app/checkout.tsx',
              "    paymentMethod:\n      paymentMethod !== null,\n  };",
              "    paymentMethod:\n      paymentMethod !== null,\n\n"
              "    prescription:\n"
              "      prescriptionIsReady,\n"
              "  };",
          )

          # Checkout: attach after order creation and before WhatsApp opens.
          replace_once(
              'src/app/checkout.tsx',
              "          ),\n        });\n\n      /**\n       * Open WhatsApp with a very short, ready-to-send confirmation",
              "          ),\n        });\n\n"
              "      if (\n"
              "        requiresPrescription &&\n"
              "        prescriptionSubmission?.status ===\n"
              "          'submitted'\n"
              "      ) {\n"
              "        await attachPrescriptionToOrder(\n"
              "          createdOrder.id,\n"
              "          prescriptionSubmission.id,\n"
              "        );\n"
              "      }\n\n"
              "      /**\n"
              "       * Open WhatsApp with a very short, ready-to-send confirmation",
          )

          # Checkout: compliance UI before payment.
          compliance_ui = '''        {(requiresPrescription ||\n          hasAgeRestrictedItems) && (\n          <View style={styles.section}>\n            <Text\n              style={\n                styles.sectionTitle\n              }\n            >\n              متطلبات الصيدلية\n            </Text>\n\n            {requiresPrescription && (\n              <View\n                style={\n                  styles.prescriptionCard\n                }\n              >\n                <View\n                  style={\n                    styles.prescriptionHeader\n                  }\n                >\n                  <View\n                    style={\n                      styles.prescriptionIcon\n                    }\n                  >\n                    <Ionicons\n                      name="document-text-outline"\n                      size={22}\n                      color="#8A5A18"\n                    />\n                  </View>\n\n                  <View\n                    style={\n                      styles.prescriptionCopy\n                    }\n                  >\n                    <Text\n                      style={\n                        styles.prescriptionTitle\n                      }\n                    >\n                      هذا الطلب يحتاج روشتة\n                    </Text>\n\n                    <Text\n                      style={\n                        styles.prescriptionDescription\n                      }\n                    >\n                      ارفع صورة واضحة أو PDF\n                      للروشتة قبل إرسال الطلب.\n                      الملف خاص ولا يظهر في\n                      الكتالوج أو لأي مستخدم آخر.\n                    </Text>\n                  </View>\n                </View>\n\n                {isLoadingPrescription ? (\n                  <View\n                    style={\n                      styles.prescriptionLoading\n                    }\n                  >\n                    <ActivityIndicator\n                      size="small"\n                      color="#8A5A18"\n                    />\n                  </View>\n                ) : prescriptionIsReady ? (\n                  <View\n                    style={\n                      styles.prescriptionReadyRow\n                    }\n                  >\n                    <Ionicons\n                      name="checkmark-circle"\n                      size={20}\n                      color={BRAND_GREEN}\n                    />\n\n                    <Text\n                      style={\n                        styles.prescriptionReadyText\n                      }\n                      numberOfLines={1}\n                    >\n                      {prescriptionFileName ??\n                        'تم رفع الروشتة'}\n                    </Text>\n                  </View>\n                ) : null}\n\n                <Pressable\n                  disabled={\n                    isUploadingPrescription ||\n                    isLoadingPrescription\n                  }\n                  style={({ pressed }) => [\n                    styles.prescriptionButton,\n                    (isUploadingPrescription ||\n                      isLoadingPrescription) &&\n                      styles.prescriptionButtonDisabled,\n                    pressed &&\n                      !isUploadingPrescription &&\n                      !isLoadingPrescription &&\n                      styles.buttonPressed,\n                  ]}\n                  onPress={() => {\n                    void uploadPrescription();\n                  }}\n                >\n                  {isUploadingPrescription ? (\n                    <ActivityIndicator\n                      size="small"\n                      color="#ffffff"\n                    />\n                  ) : (\n                    <Ionicons\n                      name={\n                        prescriptionIsReady\n                          ? 'refresh-outline'\n                          : 'cloud-upload-outline'\n                      }\n                      size={19}\n                      color="#ffffff"\n                    />\n                  )}\n\n                  <Text\n                    style={\n                      styles.prescriptionButtonText\n                    }\n                  >\n                    {prescriptionIsReady\n                      ? 'استبدال الروشتة'\n                      : 'رفع الروشتة'}\n                  </Text>\n                </Pressable>\n\n                {prescriptionError && (\n                  <Text\n                    style={\n                      styles.prescriptionError\n                    }\n                  >\n                    {prescriptionError}\n                  </Text>\n                )}\n\n                {submitted &&\n                  !validation.prescription && (\n                    <Text\n                      style={\n                        styles.prescriptionError\n                      }\n                    >\n                      ارفع الروشتة قبل إرسال\n                      الطلب.\n                    </Text>\n                  )}\n              </View>\n            )}\n\n            {hasAgeRestrictedItems && (\n              <View\n                style={\n                  styles.ageVerificationCard\n                }\n              >\n                <Ionicons\n                  name="card-outline"\n                  size={22}\n                  color="#7B4B14"\n                />\n\n                <View\n                  style={\n                    styles.ageVerificationCopy\n                  }\n                >\n                  <Text\n                    style={\n                      styles.ageVerificationTitle\n                    }\n                  >\n                    التحقق من السن عند التسليم\n                  </Text>\n\n                  <Text\n                    style={\n                      styles.ageVerificationText\n                    }\n                  >\n                    قد يطلب المندوب أو فريق\n                    الصيدلية بطاقة هوية قبل\n                    تسليم المنتجات المقيدة\n                    بالعمر.\n                  </Text>\n                </View>\n              </View>\n            )}\n          </View>\n        )}\n\n'''
          replace_once(
              'src/app/checkout.tsx',
              "        {/* PAYMENT */}\n",
              compliance_ui + "        {/* PAYMENT */}\n",
          )

          # Checkout styles before existing PAYMENT section styles.
          compliance_styles = '''    prescriptionCard: {\n      backgroundColor: '#FFF8EB',\n      borderColor: '#F0D8AE',\n      borderRadius: 18,\n      borderWidth: 1,\n      marginBottom: 14,\n      padding: 15,\n    },\n\n    prescriptionHeader: {\n      alignItems: 'flex-start',\n      flexDirection: 'row',\n    },\n\n    prescriptionIcon: {\n      alignItems: 'center',\n      backgroundColor: '#ffffff',\n      borderRadius: 20,\n      height: 40,\n      justifyContent: 'center',\n      width: 40,\n    },\n\n    prescriptionCopy: {\n      flex: 1,\n      marginLeft: 12,\n    },\n\n    prescriptionTitle: {\n      color: '#5D3B13',\n      fontSize: 14,\n      fontWeight: '800',\n      textAlign: 'right',\n    },\n\n    prescriptionDescription: {\n      color: '#806543',\n      fontSize: 11,\n      lineHeight: 18,\n      marginTop: 5,\n      textAlign: 'right',\n    },\n\n    prescriptionLoading: {\n      alignItems: 'center',\n      marginTop: 14,\n    },\n\n    prescriptionReadyRow: {\n      alignItems: 'center',\n      backgroundColor: '#ffffff',\n      borderRadius: 12,\n      flexDirection: 'row',\n      marginTop: 13,\n      paddingHorizontal: 12,\n      paddingVertical: 10,\n    },\n\n    prescriptionReadyText: {\n      color: '#325E42',\n      flex: 1,\n      fontSize: 11,\n      fontWeight: '700',\n      marginLeft: 8,\n      textAlign: 'right',\n    },\n\n    prescriptionButton: {\n      alignItems: 'center',\n      backgroundColor: '#8A5A18',\n      borderRadius: 14,\n      flexDirection: 'row',\n      gap: 8,\n      justifyContent: 'center',\n      marginTop: 13,\n      minHeight: 48,\n      paddingHorizontal: 16,\n    },\n\n    prescriptionButtonDisabled: {\n      opacity: 0.55,\n    },\n\n    prescriptionButtonText: {\n      color: '#ffffff',\n      fontSize: 12,\n      fontWeight: '800',\n    },\n\n    prescriptionError: {\n      color: '#B44343',\n      fontSize: 11,\n      lineHeight: 17,\n      marginTop: 9,\n      textAlign: 'right',\n    },\n\n    ageVerificationCard: {\n      alignItems: 'flex-start',\n      backgroundColor: '#FFF8EB',\n      borderColor: '#F0D8AE',\n      borderRadius: 18,\n      borderWidth: 1,\n      flexDirection: 'row',\n      padding: 15,\n    },\n\n    ageVerificationCopy: {\n      flex: 1,\n      marginLeft: 12,\n    },\n\n    ageVerificationTitle: {\n      color: '#5D3B13',\n      fontSize: 13,\n      fontWeight: '800',\n      textAlign: 'right',\n    },\n\n    ageVerificationText: {\n      color: '#806543',\n      fontSize: 11,\n      lineHeight: 18,\n      marginTop: 5,\n      textAlign: 'right',\n    },\n\n'''
          replace_once(
              'src/app/checkout.tsx',
              "    /* -------------------------------- */\n    /* PAYMENT                          */",
              compliance_styles + "    /* -------------------------------- */\n    /* PAYMENT                          */",
          )

          # Friendly server-side compliance errors for old/stale carts once
          # the remote feature flag is enabled.
          replace_once(
              'src/services/order-service.ts',
              "    [\n      'product_variant_required',\n      'يجب اختيار نوع أو حجم المنتج قبل إتمام الطلب.',\n    ],",
              "    [\n      'prescription_required',\n      'هذا الطلب يحتوي على دواء يحتاج روشتة. ارفع الروشتة من صفحة إتمام الطلب ثم حاول مرة أخرى.',\n    ],\n"
              "    [\n      'prescription_approval_required',\n      'الروشتة ما زالت تحتاج مراجعة الصيدلية قبل تأكيد الطلب.',\n    ],\n"
              "    [\n      'product_variant_required',\n      'يجب اختيار نوع أو حجم المنتج قبل إتمام الطلب.',\n    ],",
          )

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Commit prescription client
        run: |
          if git diff --quiet -- src; then
            echo "No prescription client changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Add pharmacy prescription checkout flow"
          git push origin HEAD:agent/p0-launch-hardening
