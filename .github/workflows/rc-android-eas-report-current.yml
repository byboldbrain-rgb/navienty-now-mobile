name: Current Android RC EAS Status Report

on:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/rc-android-eas-report-current.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_BUILD_COMMIT: be1fb4e6a02cefa1d24ae3694ceedaadac631ce8
      TARGET_PR: '2'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Report tracker start
        shell: bash
        run: |
          gh pr comment "$TARGET_PR" --body "Android RC tracker started for commit \`$TARGET_BUILD_COMMIT\`; waiting for the existing EAS build request. No additional build is being submitted."

      - name: Find Android RC
        shell: bash
        run: |
          set -euo pipefail
          build_id=''
          for attempt in $(seq 1 60); do
            eas build:list \
              --platform android \
              --build-profile preview \
              --git-commit-hash "$TARGET_BUILD_COMMIT" \
              --limit 1 \
              --json > build-list.json
            build_id="$(jq -r 'if length > 0 then .[0].id else empty end' build-list.json)"
            if [ -n "$build_id" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$build_id" ]; then
            gh pr comment "$TARGET_PR" --body "Android RC reporter could not find an EAS Android preview build for commit \`$TARGET_BUILD_COMMIT\`."
            exit 1
          fi

          dashboard="https://expo.dev/accounts/navientynows-team/projects/navienty-now/builds/$build_id"
          initial_status="$(jq -r '.[0].status' build-list.json)"
          gh pr comment "$TARGET_PR" --body "### Android RC detected after asset fix
- Commit: \`$TARGET_BUILD_COMMIT\`
- EAS Build ID: \`$build_id\`
- Initial status: \`$initial_status\`
- Dashboard: $dashboard"

          status=''
          raw_status=''
          for attempt in $(seq 1 120); do
            eas build:view "$build_id" --json > build.json
            raw_status="$(jq -r '.status' build.json)"
            status="$(printf '%s' "$raw_status" | tr '[:upper:]' '[:lower:]')"
            case "$status" in
              finished|errored|canceled)
                break
                ;;
            esac
            sleep 15
          done

          artifact="$(jq -r '.artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty' build.json)"
          error_code="$(jq -r '.error.errorCode // .error.code // .errorCode // empty' build.json)"
          error_message="$(jq -r '.error.message // .error.errorMessage // .errorMessage // empty' build.json)"

          cat > final.md <<EOF
          ### Android RC final status after asset fix
          - Commit: \`$TARGET_BUILD_COMMIT\`
          - EAS Build ID: \`$build_id\`
          - Status: \`$raw_status\`
          - Dashboard: $dashboard
          - Install artifact: ${artifact:-not returned}
          - Error code: ${error_code:-none}
          - Error message: ${error_message:-none}

          Physical Android smoke testing remains required. iOS remains blocked on Apple Developer Program membership.
          EOF
          gh pr comment "$TARGET_PR" --body-file final.md

          if [ "$status" != 'finished' ]; then
            exit 1
          fi
