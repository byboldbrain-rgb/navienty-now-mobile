name: RC EAS Preview Build

on:
  workflow_dispatch:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/rc-eas-build.yml

permissions:
  contents: read

jobs:
  build:
    name: Android + iOS preview RC
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout release-candidate branch
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Require Expo access token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured as a GitHub Actions repository secret."
            exit 1
          fi

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Validate image assets
        run: node scripts/validate-image-assets.mjs

      - name: Validate v1 public scope
        run: npm run validate:v1-scope

      - name: Validate release config
        run: node scripts/validate-release-config.mjs

      - name: Validate checkout handoff
        run: node scripts/validate-checkout-handoff.mjs

      - name: Validate native maps config
        run: node scripts/validate-native-maps-config.mjs

      - name: Validate notification lifecycle
        run: node scripts/validate-notification-lifecycle.mjs

      - name: Validate App Store account controls
        run: node scripts/validate-app-store-account-controls.mjs

      - name: Validate social authentication parity
        run: node scripts/validate-social-auth-parity.mjs

      - name: Verify Expo project health
        run: npx expo-doctor@latest

      - name: Production dependency audit policy
        run: npm run audit:prod

      - name: Business and security tests
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Verify Expo authentication
        run: eas whoami

      - name: Trigger Android and iOS preview builds
        shell: bash
        run: |
          set -o pipefail
          eas build \
            --platform all \
            --profile preview \
            --non-interactive \
            --no-wait \
            --json | tee eas-rc-builds.json

      - name: Record build request
        if: success()
        run: cat eas-rc-builds.json
