name: RC EAS Preview Build

on:
  workflow_dispatch:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/rc-eas-build.yml

permissions:
  contents: read

jobs:
  build:
    name: Android + iOS preview RC
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout release-candidate branch
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Require Expo access token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured as a GitHub Actions repository secret."
            exit 1
          fi

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo project health
        run: npx expo-doctor@latest

      - name: Verify Expo authentication
        run: eas whoami

      - name: Trigger Android and iOS preview builds
        run: |
          eas build \
            --platform all \
            --profile preview \
            --non-interactive \
            --no-wait \
            --json | tee eas-rc-builds.json

      - name: Record build request
        if: success()
        run: cat eas-rc-builds.json
