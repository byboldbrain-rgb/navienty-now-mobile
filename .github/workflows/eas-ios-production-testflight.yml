name: EAS iOS production build and TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - codex/app-store-launch-readiness
    paths:
      - .github/workflows/eas-ios-production-testflight.yml

permissions:
  contents: read

concurrency:
  group: eas-ios-production-testflight
  cancel-in-progress: false

jobs:
  build_and_submit:
    name: Build iOS and upload to TestFlight
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'Start iOS TestFlight build 8'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Require Expo access token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured as a GitHub Actions repository secret."
            exit 1
          fi

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install project dependencies
        run: npm ci

      - name: Verify generated iOS Info.plist
        shell: bash
        run: |
          EXPO_NO_TELEMETRY=1 npx expo config --type introspect --json |
            node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const config = JSON.parse(input);
                const infoPlist = config._internal?.modResults?.ios?.infoPlist;
                const purpose = infoPlist?.NSMotionUsageDescription;

                if (typeof purpose !== "string" || purpose.trim().length === 0) {
                  console.error("NSMotionUsageDescription is missing from the generated iOS Info.plist.");
                  process.exit(1);
                }

                console.log("Verified generated NSMotionUsageDescription:", purpose);
              });
            '

      - name: Verify production iOS configuration
        run: eas config --platform ios --profile production --json --non-interactive

      - name: Build and upload to TestFlight
        shell: bash
        run: |
          eas build \
            --platform ios \
            --profile production \
            --auto-submit \
            --non-interactive \
            --wait \
            --message "Navienty Now v1.0.0 TestFlight build 8"
