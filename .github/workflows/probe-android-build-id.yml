name: Probe Android Build ID

on:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/probe-android-build-id.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BUILD_ID: bbe28daf-c4eb-4b2a-a457-7b24ad88dc7e

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v5
        with:
          ref: cto/launch-readiness-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Query EAS build by ID outside project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/rc-status "$RUNNER_TEMP/eas-probe"
          cd "$RUNNER_TEMP/eas-probe"
          npx --yes eas-cli@latest build:view "$BUILD_ID" --json > build.json
          jq '{id:.id,status:.status,platform:.platform,buildProfile:.buildProfile,artifactUrl:(.artifacts.buildUrl // .artifacts.applicationArchiveUrl // null),errorCode:(.error.errorCode // .error.code // .errorCode // null),errorMessage:(.error.message // .error.errorMessage // .errorMessage // null),completedAt:(.completedAt // null),updatedAt:(.updatedAt // null)}' build.json > "$GITHUB_WORKSPACE/.github/rc-status/android-build-id.json"

      - name: Commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/rc-status/android-build-id.json
          git commit -m 'ci: snapshot Android RC #3 by build ID' || exit 0
          git pull --rebase origin cto/launch-readiness-hardening
          git push origin HEAD:cto/launch-readiness-hardening
