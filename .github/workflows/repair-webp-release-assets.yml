name: Repair misnamed WebP assets for app-store release

on:
  push:
    branches:
      - codex/android-production-hardening
    paths:
      - .github/workflows/repair-webp-release-assets.yml

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'Run one-time WebP repair')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: codex/android-production-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependency lock
        run: npm ci

      - name: Repair malformed WebP asset contents
        run: node scripts/repair-mislabeled-webp-assets.mjs

      - name: Verify all bundled image formats
        run: node scripts/validate-image-assets.mjs

      - name: Commit corrected binary images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets src/assets
          if git diff --cached --quiet; then
            echo "Image assets were already valid."
            exit 0
          fi
          git commit -m "fix(assets): encode mislabeled PNG images as real WebP"
          git push origin HEAD:codex/android-production-hardening
