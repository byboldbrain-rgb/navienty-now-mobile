name: Google Play release readiness

on:
  push:
    branches:
      - codex/google-play-release-readiness-20260905

permissions:
  contents: write

jobs:
  validate-android-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact test branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply release-blocker fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def prepend_once(path: str, prefix: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.startswith(prefix):
                  return
              p.write_text(prefix + text, encoding='utf-8')

          replace_once(
              'src/app/category/bookstore.tsx',
              "  const currentStore = catalog.store;\n  const delivery = catalog.delivery;\n",
              "  const currentCatalog = catalog;\n  const currentStore = currentCatalog.store;\n  const delivery = currentCatalog.delivery;\n",
          )
          replace_once(
              'src/app/category/bookstore.tsx',
              "        findPrintingServiceSection(\n          catalog,\n          item.section,\n        );",
              "        findPrintingServiceSection(\n          currentCatalog,\n          item.section,\n        );",
          )

          replace_once(
              'src/components/cart/global-location-picker-screen.native.tsx',
              "  map: {\n    ...StyleSheet.absoluteFillObject,\n  },",
              "  map: {\n    bottom: 0,\n    left: 0,\n    position: 'absolute',\n    right: 0,\n    top: 0,\n  },",
          )

          replace_once(
              'src/services/order-service-legacy.ts',
              "  Order,\n  OrderStatus,\n",
              "  Order,\n  OrderItem,\n  OrderStatus,\n",
          )
          replace_once(
              'src/services/order-service-legacy.ts',
              "  ).map((item) => {\n    const printJob =",
              "  ).map((item): OrderItem => {\n    const printJob =",
          )
          replace_once(
              'src/services/order-service-legacy.ts',
              "    const itemKind =\n      item.item_kind ===",
              "    const itemKind: OrderItem['itemKind'] =\n      item.item_kind ===",
          )

          # These facade modules intentionally re-export the legacy/base API
          # and then override a small number of public functions. ECMAScript
          # resolves the explicit exports correctly, but eslint-plugin-import's
          # import/export rule reports the intentional shadowing as duplicates.
          for path in (
              'src/services/catalog-service.ts',
              'src/services/delivery-location-service.ts',
              'src/services/order-service.ts',
              'src/store/cart-store.ts',
          ):
              prepend_once(
                  path,
                  '/* eslint-disable import/export -- compatibility facade intentionally overrides selected re-exports */\n',
              )

          # This wrapper is a real React/Zustand hook and must follow Hook naming
          # rules rather than suppressing react-hooks/rules-of-hooks.
          p = Path('src/store/cart-store.ts')
          text = p.read_text(encoding='utf-8')
          count = text.count('wrappedUseCartStore')
          if count != 5:
              raise SystemExit(f'src/store/cart-store.ts: expected 5 wrappedUseCartStore references, found {count}')
          p.write_text(
              text.replace('wrappedUseCartStore', 'useCartStoreFacade'),
              encoding='utf-8',
          )
          PY
          git diff --check
          git diff -- src/app/category/bookstore.tsx src/components/cart/global-location-picker-screen.native.tsx src/services/order-service-legacy.ts src/services/catalog-service.ts src/services/delivery-location-service.ts src/services/order-service.ts src/store/cart-store.ts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked dependencies
        run: npm ci

      - name: Expo Doctor
        run: npx expo-doctor@latest

      - name: Validate Expo production configuration
        run: |
          npx expo config --type prebuild --json > /tmp/expo-prebuild-config.json
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('/tmp/expo-prebuild-config.json', 'utf8'));
          const failures = [];
          if (config.android?.package !== 'com.navienty.now') failures.push(`Unexpected Android package: ${config.android?.package}`);
          if (!config.version) failures.push('Missing Expo app version');
          if (!config.extra?.eas?.projectId) failures.push('Missing EAS projectId');
          if (!config.icon) failures.push('Missing app icon');
          if (!config.android?.adaptiveIcon?.foregroundImage) failures.push('Missing Android adaptive icon foreground');
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log(`Android package: ${config.android.package}`);
          console.log(`App version: ${config.version}`);
          console.log(`EAS projectId: ${config.extra.eas.projectId}`);
          NODE

      - name: Business-rule tests
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Validate public v1 scope
        run: npm run validate:v1-scope

      - name: Production dependency security audit
        run: npm run audit:prod

      - name: Android Metro export
        run: npx expo export --platform android --output-dir /tmp/navienty-android-export

      - name: Generate clean Android native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compile Android release bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify AAB exists
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB_PATH"
          ls -lh "$AAB_PATH"

      - name: Upload compile-check AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-compile-check-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 1

      - name: Commit validated source fixes to test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/category/bookstore.tsx src/components/cart/global-location-picker-screen.native.tsx src/services/order-service-legacy.ts src/services/catalog-service.ts src/services/delivery-location-service.ts src/services/order-service.ts src/store/cart-store.ts
          git commit -m "fix: resolve Android release blockers"
          git push origin HEAD:codex/google-play-release-readiness-20260905
