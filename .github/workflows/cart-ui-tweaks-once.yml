name: Apply cart UI tweaks once

on:
  push:
    branches:
      - codex/android-production-hardening
    paths:
      - .github/workflows/cart-ui-tweaks-once.yml

permissions:
  contents: write

jobs:
  apply-cart-ui-tweaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/android-production-hardening
          fetch-depth: 0

      - name: Apply scoped Cart UI changes
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/apply-cart-ui-tweaks.py
          python /tmp/apply-cart-ui-tweaks.py

      - name: Remove one-time workflow and commit changes
        shell: bash
        run: |
          rm -f .github/workflows/cart-ui-tweaks-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/cart-details-screen.tsx .github/workflows/cart-ui-tweaks-once.yml

          if git diff --cached --quiet; then
            echo "No Cart UI changes were generated."
            exit 0
          fi

          git commit -m "Refine cart offer pricing and header copy"
          git push origin HEAD:codex/android-production-hardening
