name: Android production hardening

on:
  push:
    branches:
      - codex/android-production-hardening
      - codex/db-artwork-stage

permissions:
  contents: write

jobs:
  harden-and-validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      contains(github.event.head_commit.message, 'run android production hardening')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Enforce strict database-first priority
        run: python3 scripts/enforce-strict-database-first-artwork.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate Expo configuration
        run: npx expo config --type public > /tmp/navienty-expo-config.json

      - name: Business-rule tests
        run: npm test

      - name: TypeScript artwork regression check
        shell: bash
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee /tmp/navienty-tsc.log
          TSC_STATUS=${PIPESTATUS[0]}
          set -e

          if grep -E '^src/(services/bootstrap-service|services/app-artwork-service|hooks/use-database-first-artwork|components/ui/database-first-image|app/category/restaurants|features/home/home-components|app/login|app/_layout|components/dynamic-campaign-popup).*error TS' /tmp/navienty-tsc.log; then
            echo "Database-first artwork introduced a TypeScript error."
            exit 1
          fi

          if [ "$TSC_STATUS" -ne 0 ]; then
            echo "TypeScript still reports pre-existing errors outside the artwork change set; continuing validation."
          fi

      - name: Lint diagnostics
        continue-on-error: true
        run: npm run lint

      - name: Validate v1 release scope diagnostics
        continue-on-error: true
        run: npm run validate:v1-scope

      - name: Validate Android Metro bundle and assets
        run: npx expo export --platform android --output-dir /tmp/navienty-android-export

      - name: Commit validated strict database-first artwork
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: enforce strict database-first artwork priority"
          git push origin HEAD:${{ github.ref_name }}
