name: Android production hardening

on:
  push:
    branches:
      - codex/android-production-hardening
      - codex/db-artwork-stage

permissions:
  contents: write

jobs:
  harden-and-validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      contains(github.event.head_commit.message, 'run android production hardening')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply database-first artwork patches
        run: python3 scripts/apply-database-first-artwork.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate Expo configuration
        run: npx expo config --type public > /tmp/navienty-expo-config.json

      - name: Business-rule tests
        run: npm test

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint diagnostics
        continue-on-error: true
        run: npm run lint

      - name: Validate v1 release scope diagnostics
        continue-on-error: true
        run: npm run validate:v1-scope

      - name: Validate Android Metro bundle and assets
        run: npx expo export --platform android --output-dir /tmp/navienty-android-export

      - name: Commit validated database-first artwork
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts/apply-database-first-artwork.py
          git commit -m "feat: database-first runtime artwork"
          git push origin HEAD:${{ github.ref_name }}
