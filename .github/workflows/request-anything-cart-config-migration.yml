name: Request Anything cart config migration

on:
  push:
    branches:
      - codex/android-production-hardening

permissions:
  contents: write

concurrency:
  group: request-anything-cart-config-migration
  cancel-in-progress: false

jobs:
  migrate-validate-and-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/android-production-hardening
          fetch-depth: 0

      - name: Apply guarded Request Anything screen migration
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/app/category/request-anything.tsx')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          old_import = "} from 'react-native-safe-area-context';\nimport {\n  findStorefrontCategoryTile,"
          new_import = "} from 'react-native-safe-area-context';\nimport {\n  getLegacyRequestAnythingCartConfiguration,\n  type RequestAnythingCartConfiguration,\n} from '../../domain/request-anything-cart-config';\nimport {\n  getRequestAnythingCartConfiguration,\n} from '../../services/request-anything-cart-config-service';\nimport {\n  findStorefrontCategoryTile,"
          replace_once(old_import, new_import, 'imports')

          old_constants = "const REQUEST_ANYTHING_INTERNAL_STORE_ID =\n  '4ebd8b80-8288-4c9b-980a-f15b5274e78b';\n\nconst REQUEST_ANYTHING_INTERNAL_PRODUCT_ID =\n  'b260c5e5-e6cb-462b-b025-627d7bb2cff2';\n\nconst REQUEST_ANYTHING_DELIVERY_FEE =\n  25;\n\n"
          replace_once(old_constants, '', 'hardcoded screen configuration')

          state_marker = "    useState<BootstrapCategory | null>(\n      null,\n    );\n\n  const [\n    isLoading,"
          state_replacement = "    useState<BootstrapCategory | null>(\n      null,\n    );\n\n  const [\n    cartConfiguration,\n    setCartConfiguration,\n  ] =\n    useState<RequestAnythingCartConfiguration>(\n      getLegacyRequestAnythingCartConfiguration,\n    );\n\n  const [\n    isLoading,"
          replace_once(state_marker, state_replacement, 'cart configuration state')

          bootstrap_marker = "          const bootstrap =\n            await getAppBootstrap();\n\n          let remoteScreenImages:"
          bootstrap_replacement = "          const bootstrap =\n            await getAppBootstrap();\n\n          const cartConfigurationPromise =\n            getRequestAnythingCartConfiguration(\n              bootstrap.settings\n                .default_service_area_id,\n            );\n\n          let remoteScreenImages:"
          replace_once(bootstrap_marker, bootstrap_replacement, 'remote config load start')

          artwork_marker = "          setCampaignImageOverrides(\n            remoteScreenImages,\n          );"
          artwork_replacement = "          setCartConfiguration(\n            await cartConfigurationPromise,\n          );\n\n          setCampaignImageOverrides(\n            remoteScreenImages,\n          );"
          replace_once(artwork_marker, artwork_replacement, 'resolved config state')

          clear_marker = "      clearStoreCart(\n        REQUEST_ANYTHING_INTERNAL_STORE_ID,\n      );"
          clear_replacement = "      const legacyCartConfiguration =\n        getLegacyRequestAnythingCartConfiguration();\n\n      if (\n        legacyCartConfiguration.storeId !==\n        cartConfiguration.storeId\n      ) {\n        clearStoreCart(\n          legacyCartConfiguration.storeId,\n        );\n      }\n\n      clearStoreCart(\n        cartConfiguration.storeId,\n      );"
          replace_once(clear_marker, clear_replacement, 'cart preparation')

          if text.count('REQUEST_ANYTHING_INTERNAL_STORE_ID') != 2:
              raise SystemExit('store id usage count changed unexpectedly')
          text = text.replace('REQUEST_ANYTHING_INTERNAL_STORE_ID', 'cartConfiguration.storeId')

          if text.count('REQUEST_ANYTHING_INTERNAL_PRODUCT_ID') != 1:
              raise SystemExit('product id usage count changed unexpectedly')
          text = text.replace('REQUEST_ANYTHING_INTERNAL_PRODUCT_ID', 'cartConfiguration.productId')

          if text.count('REQUEST_ANYTHING_DELIVERY_FEE') != 1:
              raise SystemExit('delivery fee usage count changed unexpectedly')
          text = text.replace('REQUEST_ANYTHING_DELIVERY_FEE', 'cartConfiguration.deliveryFee')

          dependency_marker = "      addItem,\n      clearStoreCart,\n      router,\n      trimmedPickupAddress,"
          dependency_replacement = "      addItem,\n      cartConfiguration,\n      clearStoreCart,\n      router,\n      trimmedPickupAddress,"
          replace_once(dependency_marker, dependency_replacement, 'callback dependencies')

          path.write_text(text)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Request Anything config tests
        run: node --experimental-strip-types --test tests/request-anything-cart-config.test.mjs

      - name: Full test suite
        run: npm test

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --quiet

      - name: Diff validation
        run: git diff --check

      - name: Verify intended migration
        run: |
          grep -q "getRequestAnythingCartConfiguration" src/app/category/request-anything.tsx
          grep -q "cartConfiguration.storeId" src/app/category/request-anything.tsx
          grep -q "cartConfiguration.productId" src/app/category/request-anything.tsx
          grep -q "cartConfiguration.deliveryFee" src/app/category/request-anything.tsx
          ! grep -q "REQUEST_ANYTHING_INTERNAL_STORE_ID" src/app/category/request-anything.tsx
          ! grep -q "REQUEST_ANYTHING_INTERNAL_PRODUCT_ID" src/app/category/request-anything.tsx
          ! grep -q "REQUEST_ANYTHING_DELIVERY_FEE" src/app/category/request-anything.tsx
          grep -q "listStores" src/services/request-anything-cart-config-service.ts
          grep -q "getStoreCatalog" src/services/request-anything-cart-config-service.ts
          grep -q "legacy-fallback" src/domain/request-anything-cart-config.ts

      - name: Commit validated migration and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/request-anything-cart-config-migration.yml
          git add src/app/category/request-anything.tsx src/domain/request-anything-cart-config.ts src/services/request-anything-cart-config-service.ts tests/request-anything-cart-config.test.mjs
          git commit -m "Migrate Request Anything cart config to Supabase"
          git push origin HEAD:codex/android-production-hardening
