name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/p0-launch-hardening
      - cto/launch-readiness-hardening

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate image assets
        run: node scripts/validate-image-assets.mjs

      - name: Validate v1 public scope
        run: npm run validate:v1-scope

      - name: Validate release config
        run: node scripts/validate-release-config.mjs

      - name: Validate checkout handoff
        run: node scripts/validate-checkout-handoff.mjs

      - name: Validate native maps config
        run: node scripts/validate-native-maps-config.mjs

      - name: Validate notification lifecycle
        run: node scripts/validate-notification-lifecycle.mjs

      - name: Validate App Store account controls
        run: node scripts/validate-app-store-account-controls.mjs

      - name: Validate social authentication parity
        run: node scripts/validate-social-auth-parity.mjs

      - name: Production dependency audit policy
        run: npm run audit:prod

      - name: Business-rule tests
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
