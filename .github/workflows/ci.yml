name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/p0-launch-hardening
      - cto/launch-readiness-hardening

permissions:
  contents: read

jobs:
  patch_checkout_handoff:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v5
        with:
          ref: cto/launch-readiness-hardening
          fetch-depth: 0

      - name: Apply one-shot checkout handoff patch
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q 'openOrderInWhatsApp' src/app/checkout.tsx && \
             grep -q 'متابعة عبر واتساب' src/app/order-confirmation.tsx; then
            echo 'Checkout handoff patch already applied.'
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/patch-checkout-handoff.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Run focused validation"

          start = workflow.find(start_marker)
          end = workflow.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit('Could not extract one-shot patch program')

          raw_program = workflow[start + len(start_marker):end]
          program = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in raw_program.splitlines()
          ) + '\n'
          exec(compile(program, 'patch-checkout-handoff.py', 'exec'))
          PY

          node scripts/validate-checkout-handoff.mjs

      - name: Commit checkout handoff fix
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/checkout.tsx src/app/order-confirmation.tsx scripts/validate-checkout-handoff.mjs
          if git diff --cached --quiet; then
            echo 'No checkout patch changes to commit.'
            exit 0
          fi
          git commit -m 'fix: keep checkout in app before WhatsApp handoff'
          git pull --rebase origin cto/launch-readiness-hardening
          git push origin HEAD:cto/launch-readiness-hardening

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate image assets
        run: node scripts/validate-image-assets.mjs

      - name: Validate release config
        run: node scripts/validate-release-config.mjs

      - name: Production dependency audit policy
        run: npm run audit:prod

      - name: Business-rule tests
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
