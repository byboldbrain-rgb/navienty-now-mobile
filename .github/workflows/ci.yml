name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/p0-launch-hardening
      - cto/launch-readiness-hardening

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate image assets
        run: node scripts/validate-image-assets.mjs

      - name: Validate release config
        run: node scripts/validate-release-config.mjs

      - name: Validate checkout handoff
        run: node scripts/validate-checkout-handoff.mjs

      - name: Production dependency audit policy
        run: npm run audit:prod

      - name: Business-rule tests
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  android_rc_after_checkout_fix:
    name: Android RC after Checkout fix
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v5
        with:
          ref: cto/launch-readiness-hardening

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Require Expo access token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo 'EXPO_TOKEN is not configured.'
            exit 1
          fi

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Validate image assets
        run: node scripts/validate-image-assets.mjs

      - name: Validate release config
        run: node scripts/validate-release-config.mjs

      - name: Validate checkout handoff
        run: node scripts/validate-checkout-handoff.mjs

      - name: Verify Expo project health
        run: npx expo-doctor@latest

      - name: Production dependency audit policy
        run: npm run audit:prod

      - name: Business and security tests
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Verify Expo authentication
        run: eas whoami

      - name: Build Android preview RC
        shell: bash
        run: |
          set -o pipefail
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json | tee eas-android-checkout-fix.json

      - name: Print Android RC result
        if: success()
        run: cat eas-android-checkout-fix.json
