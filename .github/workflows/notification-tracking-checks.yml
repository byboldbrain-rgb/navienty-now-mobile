name: Notification tracking checks

on:
  pull_request:
    paths:
      - 'src/services/notification-analytics-service.ts'
      - 'src/components/push-notifications-bridge.tsx'
      - 'src/app/checkout.tsx'
      - 'src/app/global-checkout.tsx'
      - 'src/components/service/service-package-checkout.tsx'
      - '.github/workflows/notification-tracking-checks.yml'
  push:
    branches:
      - codex/android-production-hardening
    paths:
      - 'src/services/notification-analytics-service.ts'
      - 'src/components/push-notifications-bridge.tsx'
      - 'src/app/checkout.tsx'
      - 'src/app/global-checkout.tsx'
      - 'src/components/service/service-package-checkout.tsx'

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint modified notification/checkout files
        run: |
          npx eslint src/services/notification-analytics-service.ts src/components/push-notifications-bridge.tsx src/app/checkout.tsx src/app/global-checkout.tsx src/components/service/service-package-checkout.tsx
