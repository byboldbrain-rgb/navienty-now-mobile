name: Probe Current Android RC

on:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/probe-current-android-rc.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      TARGET_BUILD_COMMIT: be1fb4e6a02cefa1d24ae3694ceedaadac631ce8

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v5
        with:
          ref: cto/launch-readiness-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Require Expo access token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo 'EXPO_TOKEN is not configured.'
            exit 1
          fi

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Probe existing Android RC build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/rc-status

          build_id=''
          for attempt in $(seq 1 60); do
            eas build:list \
              --platform android \
              --build-profile preview \
              --git-commit-hash "$TARGET_BUILD_COMMIT" \
              --limit 1 \
              --json > build-list.json
            build_id="$(jq -r 'if length > 0 then .[0].id else empty end' build-list.json)"
            if [ -n "$build_id" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$build_id" ]; then
            cat > .github/rc-status/android-current.json <<EOF
          {
            "targetCommit": "$TARGET_BUILD_COMMIT",
            "found": false,
            "status": "NOT_FOUND"
          }
          EOF
          else
            eas build:view "$build_id" --json > build.json
            jq '{
              targetCommit: "'"$TARGET_BUILD_COMMIT"'",
              found: true,
              id: .id,
              status: .status,
              platform: .platform,
              buildProfile: .buildProfile,
              artifactUrl: (.artifacts.buildUrl // .artifacts.applicationArchiveUrl // null),
              errorCode: (.error.errorCode // .error.code // .errorCode // null),
              errorMessage: (.error.message // .error.errorMessage // .errorMessage // null)
            }' build.json > .github/rc-status/android-current.json
          fi

      - name: Commit probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/rc-status/android-current.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ci: record current Android RC probe result'
          git push origin HEAD:cto/launch-readiness-hardening
