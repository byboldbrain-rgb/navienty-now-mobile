name: Probe Current Android Gradle Error

on:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/probe-current-android-gradle.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BUILD_ID: 4f0f449d-8a54-4860-b618-f0909e2972f5

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v5
        with:
          ref: cto/launch-readiness-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch EAS build metadata
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build:view "$BUILD_ID" --json > /tmp/build.json

      - name: Download and extract redacted Gradle failure context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/rc-status /tmp/eas-logs
          jq -r '.logFiles[]? | if type == "string" then . else (.url // .downloadUrl // empty) end' /tmp/build.json > /tmp/log-urls.txt

          : > /tmp/all.log
          index=0
          while IFS= read -r log_url; do
            if [ -z "$log_url" ]; then
              continue
            fi
            index=$((index + 1))
            chunk="/tmp/eas-logs/log-$index.bin"
            if curl --compressed --fail --silent --show-error --location "$log_url" --output "$chunk"; then
              if gzip -t "$chunk" >/dev/null 2>&1; then
                gzip -dc "$chunk" >> /tmp/all.log || true
              else
                cat "$chunk" >> /tmp/all.log
              fi
              printf '\n' >> /tmp/all.log
            fi
          done < /tmp/log-urls.txt

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          raw = Path('/tmp/all.log').read_text(errors='replace') if Path('/tmp/all.log').exists() else ''
          lines = []
          for item in raw.splitlines():
              line = item
              try:
                  obj = json.loads(item)
                  if isinstance(obj, dict):
                      line = str(obj.get('msg') or obj.get('message') or obj.get('data') or item)
              except Exception:
                  pass
              lines.append(line)

          pattern = re.compile(
              r'RUN_GRADLEW|FAILURE:|What went wrong|Execution failed|A problem occurred|'
              r'AAPT|resource compilation|Could not|Caused by:|Exception|BUILD FAILED|error[: ]',
              re.I,
          )
          hits = [i for i, line in enumerate(lines) if pattern.search(line)]
          selected = set()
          for i in hits:
              for j in range(max(0, i - 5), min(len(lines), i + 9)):
                  selected.add(j)
          context = [lines[i] for i in sorted(selected)]
          if not context:
              context = ['No matching Gradle failure context found in exposed EAS log files.']

          text = '\n'.join(context[-260:])
          text = re.sub(r'https?://\S+', '[URL_REDACTED]', text)
          text = re.sub(r'\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b', '[EMAIL_REDACTED]', text)
          text = re.sub(r'(?i)(token|secret|password|api[_-]?key|access[_-]?key)\s*[:=]\s*\S+', r'\1=[REDACTED]', text)
          text = re.sub(r'\bsb_(?:publishable|secret)_[A-Za-z0-9_-]+', 'sb_[REDACTED]', text)

          Path('.github/rc-status/android-gradle-error.txt').write_text(text[:30000] + '\n')
          PY

      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/rc-status/android-gradle-error.txt
          git commit -m 'ci: record current Android Gradle diagnostic' || exit 0
          git pull --rebase origin cto/launch-readiness-hardening
          git push origin HEAD:cto/launch-readiness-hardening
