name: Probe Current Android Build Progress

on:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/probe-current-android-gradle.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BUILD_ID: bbe28daf-c4eb-4b2a-a457-7b24ad88dc7e

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v5
        with:
          ref: cto/launch-readiness-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch EAS build metadata
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build:view "$BUILD_ID" --json > /tmp/build.json

      - name: Download and extract redacted build progress
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/rc-status /tmp/eas-logs
          jq -r '.logFiles[]? | if type == "string" then . else (.url // .downloadUrl // empty) end' /tmp/build.json > /tmp/log-urls.txt

          : > /tmp/all.log
          index=0
          while IFS= read -r log_url; do
            if [ -z "$log_url" ]; then
              continue
            fi
            index=$((index + 1))
            chunk="/tmp/eas-logs/log-$index.bin"
            if curl --compressed --fail --silent --show-error --location "$log_url" --output "$chunk"; then
              if gzip -t "$chunk" >/dev/null 2>&1; then
                gzip -dc "$chunk" >> /tmp/all.log || true
              else
                cat "$chunk" >> /tmp/all.log
              fi
              printf '\n' >> /tmp/all.log
            fi
          done < /tmp/log-urls.txt

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          raw = Path('/tmp/all.log').read_text(errors='replace') if Path('/tmp/all.log').exists() else ''
          lines = []
          for item in raw.splitlines():
              line = item
              try:
                  obj = json.loads(item)
                  if isinstance(obj, dict):
                      line = str(obj.get('msg') or obj.get('message') or obj.get('data') or item)
              except Exception:
                  pass
              lines.append(line)

          interesting = re.compile(
              r'^(Start phase:|End phase:)|RUN_GRADLEW|assembleRelease|BUILD (FAILED|SUCCESSFUL)|'
              r'FAILURE:|Execution failed|AAPT|resource compilation|Upload|Build failed|Build finished|error[: ]',
              re.I,
          )
          selected = [line for line in lines if interesting.search(line)]
          tail = lines[-80:] if lines else []
          combined = selected[-180:] + ['--- LOG TAIL ---'] + tail
          text = '\n'.join(combined)
          text = re.sub(r'https?://\S+', '[URL_REDACTED]', text)
          text = re.sub(r'\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b', '[EMAIL_REDACTED]', text)
          text = re.sub(r'(?i)(token|secret|password|api[_-]?key|access[_-]?key)\s*[:=]\s*\S+', r'\1=[REDACTED]', text)
          text = re.sub(r'\bsb_(?:publishable|secret)_[A-Za-z0-9_-]+', 'sb_[REDACTED]', text)

          meta = json.loads(Path('/tmp/build.json').read_text())
          header = {
              'id': meta.get('id'),
              'status': meta.get('status'),
              'updatedAt': meta.get('updatedAt'),
              'completedAt': meta.get('completedAt'),
          }
          Path('.github/rc-status/android-build-progress.txt').write_text(
              json.dumps(header) + '\n' + text[-30000:] + '\n'
          )
          PY

      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/rc-status/android-build-progress.txt
          git commit -m 'ci: record Android RC #3 build progress' || exit 0
          git pull --rebase origin cto/launch-readiness-hardening
          git push origin HEAD:cto/launch-readiness-hardening
