name: Android RC EAS Status Report

on:
  workflow_dispatch:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/rc-android-eas-report.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  report:
    name: Report Android preview RC
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_BUILD_COMMIT: 69b9fa18a032c5c1fae26f071890f3f4c705cbc6
      TARGET_PR: '2'

    steps:
      - name: Checkout release-candidate branch
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Require Expo access token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured as a GitHub Actions repository secret."
            exit 1
          fi

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Find and report Android RC build
        shell: bash
        run: |
          set -euo pipefail

          build_id=""
          for attempt in $(seq 1 60); do
            eas build:list \
              --platform android \
              --build-profile preview \
              --git-commit-hash "$TARGET_BUILD_COMMIT" \
              --limit 1 \
              --json > eas-android-build-list.json

            build_id="$(jq -r 'if length > 0 then .[0].id else empty end' eas-android-build-list.json)"
            if [ -n "$build_id" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$build_id" ]; then
            gh pr comment "$TARGET_PR" --body "Android RC status reporter could not find an EAS Android preview build for commit \`$TARGET_BUILD_COMMIT\`."
            exit 1
          fi

          dashboard_url="https://expo.dev/accounts/navientynows-team/projects/navienty-now/builds/$build_id"
          status_raw="$(jq -r '.[0].status' eas-android-build-list.json)"

          cat > android-rc-start.md <<EOF
          ### Android RC build detected
          - Commit: \`$TARGET_BUILD_COMMIT\`
          - EAS Build ID: \`$build_id\`
          - Status: \`$status_raw\`
          - Dashboard: $dashboard_url

          The Android-only RC gate is tracking this build to a terminal EAS status. iOS remains blocked on Apple Developer Program membership.
          EOF
          gh pr comment "$TARGET_PR" --body-file android-rc-start.md

          status="$(printf '%s' "$status_raw" | tr '[:upper:]' '[:lower:]')"
          for attempt in $(seq 1 80); do
            eas build:view "$build_id" --json > eas-android-build.json
            status_raw="$(jq -r '.status' eas-android-build.json)"
            status="$(printf '%s' "$status_raw" | tr '[:upper:]' '[:lower:]')"
            case "$status" in
              finished|errored|canceled)
                break
                ;;
            esac
            sleep 15
          done

          artifact_url="$(jq -r '.artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty' eas-android-build.json)"
          error_code="$(jq -r '.error.errorCode // .error.code // .errorCode // empty' eas-android-build.json)"
          error_message="$(jq -r '.error.message // .error.errorMessage // .errorMessage // empty' eas-android-build.json)"

          cat > android-rc-final.md <<EOF
          ### Android RC final status
          - Commit: \`$TARGET_BUILD_COMMIT\`
          - EAS Build ID: \`$build_id\`
          - Status: \`$status_raw\`
          - Dashboard: $dashboard_url
          - Install artifact: ${artifact_url:-not returned}
          - Error code: ${error_code:-not returned}
          - Error message: ${error_message:-not returned}

          Physical-device smoke testing is still required before this PR can leave Draft status. iOS remains blocked on Apple Developer Program membership.
          EOF
          gh pr comment "$TARGET_PR" --body-file android-rc-final.md

          if [ "$status" = "errored" ]; then
            jq -r '.logFiles[]? | if type == "string" then . else (.url // .downloadUrl // empty) end' eas-android-build.json > eas-log-urls.txt
            : > eas-build-all.log
            : > eas-log-fetch-summary.txt
            index=0
            while IFS= read -r log_url; do
              if [ -n "$log_url" ]; then
                index=$((index + 1))
                chunk="eas-log-$index.bin"
                if curl --compressed --fail --silent --show-error --location "$log_url" --output "$chunk"; then
                  bytes="$(wc -c < "$chunk" | tr -d ' ')"
                  kind="$(file -b "$chunk")"
                  printf 'log %s: %s bytes; %s\n' "$index" "$bytes" "$kind" >> eas-log-fetch-summary.txt
                  if gzip -t "$chunk" >/dev/null 2>&1; then
                    gzip -dc "$chunk" >> eas-build-all.log || true
                  else
                    cat "$chunk" >> eas-build-all.log
                  fi
                  printf '\n' >> eas-build-all.log
                else
                  printf 'log %s: fetch failed\n' "$index" >> eas-log-fetch-summary.txt
                fi
              fi
            done < eas-log-urls.txt

            python - <<'PY'
          import json
          import re
          from pathlib import Path

          source = Path('eas-build-all.log')
          text = source.read_text(errors='replace') if source.exists() else ''
          expanded = []
          for raw in text.splitlines():
              line = raw
              try:
                  obj = json.loads(raw)
                  if isinstance(obj, dict):
                      line = str(obj.get('msg') or obj.get('message') or obj.get('data') or raw)
              except Exception:
                  pass
              expanded.append(line)

          keywords = re.compile(
              r'RUN_GRADLEW|FAILURE:|What went wrong|Execution failed|A problem occurred|'
              r'Could not|Caused by:|Exception|BUILD FAILED|error[: ]',
              re.I,
          )
          indexes = [i for i, line in enumerate(expanded) if keywords.search(line)]
          selected = set()
          for i in indexes:
              for j in range(max(0, i - 4), min(len(expanded), i + 7)):
                  selected.add(j)
          lines = [expanded[i] for i in sorted(selected)]
          if not lines:
              lines = ['No matching Gradle failure context was exposed through the downloaded EAS log content.']

          out = '\n'.join(lines[-220:])
          out = re.sub(r'https?://\S+', '[URL_REDACTED]', out)
          out = re.sub(r'\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b', '[EMAIL_REDACTED]', out)
          out = re.sub(r'(?i)\b(token|secret|password|api[_-]?key|access[_-]?key)\s*[:=]\s*\S+', r'\1=[REDACTED]', out)
          out = re.sub(r'\bsb_(?:publishable|secret)_[A-Za-z0-9_-]+', 'sb_[REDACTED]', out)
          Path('eas-gradle-diagnostic.txt').write_text(out[:24000])
          PY

            {
              echo '### Android RC Gradle diagnostic (redacted)'
              echo
              echo 'Log fetch summary:'
              echo '```text'
              if [ -s eas-log-fetch-summary.txt ]; then cat eas-log-fetch-summary.txt; else echo 'No EAS log URLs were returned.'; fi
              echo '```'
              echo
              echo 'Failure context:'
              echo '```text'
              cat eas-gradle-diagnostic.txt
              echo '```'
              echo
              echo 'Only error-context lines were extracted; URLs, emails, and common secret/token patterns were redacted.'
            } > eas-gradle-diagnostic.md
            gh pr comment "$TARGET_PR" --body-file eas-gradle-diagnostic.md
          fi

          if [ "$status" != "finished" ]; then
            exit 1
          fi
