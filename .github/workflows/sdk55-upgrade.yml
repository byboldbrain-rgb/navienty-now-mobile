name: Expo SDK 57 Upgrade

on:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/sdk55-upgrade.yml
      - eslint.config.js
      - scripts/apply-rn086-compat.mjs
      - src/types/expo-notifications-compat.d.ts
      - src/services/push-notifications-service.ts

permissions:
  contents: write

env:
  CI: '1'

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: cto/launch-readiness-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Apply React Native 0.86 source compatibility
        run: node scripts/apply-rn086-compat.mjs

      - name: Validate SDK 55 migration step
        run: |
          npm install expo@^55.0.0
          npx expo install --fix
          npx expo-doctor@latest
          npm test
          npx tsc --noEmit

      - name: Advance through SDK 56
        run: |
          npm install expo@^56.0.0
          npx expo install --fix
          npm test

      - name: Upgrade Expo to SDK 57 with Hermes fix
        run: npx expo install expo@^57.0.9 --fix

      - name: Expo Doctor on SDK 57
        run: npx expo-doctor@latest

      - name: Business-rule tests on SDK 57
        run: npm test

      - name: TypeScript on SDK 57
        run: npx tsc --noEmit

      - name: Production dependency audit on SDK 57
        run: npm audit --omit=dev --audit-level=high

      - name: Lint on SDK 57
        run: npm run lint

      - name: Show upgrade diff
        run: git diff -- package.json package-lock.json app.json src

      - name: Commit verified SDK 57 upgrade
        run: |
          if git diff --quiet; then
            echo "No dependency or compatibility changes to commit."
            exit 0
          fi
          git config user.name "Navienty CTO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json app.json \
            src/app/_layout.tsx \
            src/app/cart.tsx \
            src/app/index.tsx \
            src/app/login.tsx \
            'src/app/store/[id].tsx' \
            src/components/address-details-screen.native.tsx \
            src/components/location-picker-screen.native.tsx \
            src/services/push-notifications-service.ts
          git commit -m "chore: upgrade Expo stack to SDK 57"
          git push origin HEAD:cto/launch-readiness-hardening
