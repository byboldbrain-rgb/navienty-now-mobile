name: Expo SDK 56 Upgrade

on:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/sdk55-upgrade.yml
      - src/types/expo-notifications-compat.d.ts
      - src/services/push-notifications-service.ts

permissions:
  contents: write

env:
  CI: '1'

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: cto/launch-readiness-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Validate SDK 55 migration step
        run: |
          npm install expo@^55.0.0
          npx expo install --fix
          npx expo-doctor@latest
          npm test
          npx tsc --noEmit
          npm run lint

      - name: Upgrade Expo to SDK 56
        run: |
          npm install expo@^56.0.0
          npx expo install --fix

      - name: Expo Doctor on SDK 56
        run: npx expo-doctor@latest

      - name: Business-rule tests on SDK 56
        run: npm test

      - name: TypeScript on SDK 56
        run: npx tsc --noEmit

      - name: Lint on SDK 56
        run: npm run lint

      - name: Production dependency audit on SDK 56
        run: npm audit --omit=dev --audit-level=high

      - name: Show upgrade diff
        run: git diff -- package.json package-lock.json app.json

      - name: Commit verified SDK 56 upgrade
        run: |
          if git diff --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "Navienty CTO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json app.json
          git commit -m "chore: upgrade Expo stack to SDK 56"
          git push origin HEAD:cto/launch-readiness-hardening
