name: Supermarket Query Validation

on:
  push:
    branches:
      - codex/android-production-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-supermarket-query:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Business-rule and error-message tests
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
