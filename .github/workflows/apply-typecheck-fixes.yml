name: Apply TypeScript repairs

on:
  push:
    branches:
      - agent/p0-launch-hardening
    paths:
      - .github/workflows/apply-typecheck-fixes.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/p0-launch-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply narrow repairs
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_exact(path, old, new, count=1):
              file_path = Path(path)
              text = file_path.read_text(encoding='utf-8')
              found = text.count(old)
              if found < count:
                  raise RuntimeError(f'{path}: expected at least {count} matches, found {found}: {old!r}')
              text = text.replace(old, new, count)
              file_path.write_text(text, encoding='utf-8')

          # Mobile TypeScript should not typecheck Deno Edge Functions.
          tsconfig_path = Path('tsconfig.json')
          tsconfig = json.loads(tsconfig_path.read_text(encoding='utf-8'))
          tsconfig['exclude'] = ['supabase/functions/**']
          tsconfig_path.write_text(
              json.dumps(tsconfig, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          # RN Animated.Image typings do not accept pointerEvents as a direct prop.
          replace_exact(
              'src/app/_layout.tsx',
              '        <Animated.Image\n          accessibilityIgnoresInvertColors\n          pointerEvents="none"\n',
              '        <Animated.Image\n          accessibilityIgnoresInvertColors\n',
          )

          # TypeScript does not resolve RN platform suffixes by itself. Runtime still
          # resolves .android/.ios/.native/.web first where applicable.
          location_base = Path('src/components/location-picker-screen.tsx')
          if not location_base.exists():
              location_base.write_text(
                  "export { default } from './location-picker-screen.native';\n",
                  encoding='utf-8',
              )

          # Cart store now reports the only rejected cross-cart case explicitly.
          replace_exact(
              'src/hooks/use-catalog-cart.ts',
              "if (result === 'different-store')",
              "if (result === 'different-restaurant')",
          )

          # Supabase generated select inference can surface GenericStringError for
          # dynamic select strings. Keep runtime validation/mapping but make the
          # intentional boundary cast explicit through unknown.
          replace_exact(
              'src/services/service-packages-service.ts',
              'const row = data as ServicePackageRow;',
              'const row = data as unknown as ServicePackageRow;',
          )

          banner_path = Path('src/services/home-banners-service.ts')
          banner_text = banner_path.read_text(encoding='utf-8')
          banner_text = banner_text.replace(
              '  type PromoImageFit,\n',
              '  type PromoImageFit,\n  type PromoImageBlockAction,\n',
              1,
          )
          banner_text = banner_text.replace(
              '      const action =\n        rawAction === \'primary\'\n',
              '      const action: PromoImageBlockAction =\n        rawAction === \'primary\'\n',
              1,
          )
          banner_text = banner_text.replace(
              '(data ?? []) as HomeBannerImageRow[]',
              '(data ?? []) as unknown as HomeBannerImageRow[]',
              1,
          )
          banner_text = banner_text.replace(
              'return ((data ?? []) as HomeBannerRow[])',
              'return ((data ?? []) as unknown as HomeBannerRow[])',
              1,
          )
          banner_text = banner_text.replace(
              'const banner = data as HomeBannerRow;',
              'const banner = data as unknown as HomeBannerRow;',
              1,
          )
          banner_path.write_text(banner_text, encoding='utf-8')

          # The older category navigation still uses the auth-aware label; make the
          # prop optional for legacy callers and retain the existing signed-out label.
          replace_exact(
              'src/category/app-bottom-navigation.tsx',
              '  isSignedIn: boolean;\n',
              '  isSignedIn?: boolean;\n',
          )
          replace_exact(
              'src/category/app-bottom-navigation.tsx',
              '  isSignedIn,\n}: AppBottomNavigationProps)',
              '  isSignedIn = false,\n}: AppBottomNavigationProps)',
          )

          # The file was committed empty in the original service-booking feature.
          # Keep the service cart route functional by forwarding the package into
          # the canonical service checkout flow rather than crashing on import.
          Path('src/components/service/service-package-cart.tsx').write_text(
              "import ServicePackageCheckout from './service-package-checkout';\n\n"
              "type ServicePackageCartProps = {\n"
              "  servicePackageId: string;\n"
              "};\n\n"
              "export default function ServicePackageCart({\n"
              "  servicePackageId,\n"
              "}: ServicePackageCartProps) {\n"
              "  return (\n"
              "    <ServicePackageCheckout\n"
              "      servicePackageId={servicePackageId}\n"
              "    />\n"
              "  );\n"
              "}\n",
              encoding='utf-8',
          )

          # Current Supabase JS packages in this lockfile require Node 22+.
          ci_path = Path('.github/workflows/ci.yml')
          ci_text = ci_path.read_text(encoding='utf-8')
          ci_text = ci_text.replace('node-version: 20.19.4', 'node-version: 22', 1)
          ci_path.write_text(ci_text, encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Commit repairs
        run: |
          if git diff --quiet; then
            echo "No repairs needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tsconfig.json src .github/workflows/ci.yml
          git commit -m "Repair mobile TypeScript validation"
          git push origin HEAD:agent/p0-launch-hardening
