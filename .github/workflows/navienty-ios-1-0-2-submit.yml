name: Ship Navienty Now 1.0.2 iOS to App Store Connect

on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-production-hardening
    paths:
      - .github/workflows/navienty-ios-1-0-2-submit.yml

permissions:
  contents: read

concurrency:
  group: navienty-now-ios-1-0-2-submit
  cancel-in-progress: false

jobs:
  build_and_submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'Build and upload Navienty Now 1.0.2 iOS')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require authorized Expo account
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is missing. Configure EAS before submitting."
            exit 1
          fi

      - name: Configure Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install frozen dependencies
        run: npm ci

      - name: Verify bundled image formats
        run: node scripts/validate-image-assets.mjs

      - name: Validate release configuration
        run: node scripts/validate-release-config.mjs

      - name: Run regression tests
        run: npm test

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Verify Expo account and production profile
        shell: bash
        run: |
          eas whoami
          eas project:info
          eas config --platform ios --profile production --json --non-interactive >/dev/null

      - name: Create signed iOS production build and submit to TestFlight
        shell: bash
        run: |
          set -o pipefail
          eas build \
            --platform ios \
            --profile production \
            --auto-submit \
            --non-interactive \
            --wait \
            --message "Navienty Now 1.0.2 App Store update" \
            --json | tee ios-production-build.json

      - name: Publish iOS build reference to job log
        if: success()
        run: |
          jq -r 'if type=="array" then .[] else . end |
            "EAS_BUILD_ID=\(.id) STATUS=\(.status) APP_VERSION=\(.appVersion) BUILD_NUMBER=\(.appBuildVersion)"' ios-production-build.json
