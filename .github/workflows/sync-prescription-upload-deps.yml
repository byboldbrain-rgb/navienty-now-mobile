name: Sync prescription upload dependencies

on:
  push:
    branches:
      - agent/p0-launch-hardening
    paths:
      - .github/workflows/sync-prescription-upload-deps.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-launch-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update package manifest and lockfile
        run: npm install expo-document-picker@~14.0.8 expo-file-system@~19.0.23 --save --package-lock-only --ignore-scripts

      - name: Commit synchronized dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Install prescription upload dependencies"
          git push origin HEAD:agent/p0-launch-hardening
