name: Probe Actions Heartbeat

on:
  push:
    branches:
      - cto/launch-readiness-hardening
    paths:
      - .github/workflows/probe-actions-heartbeat.yml

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v5
        with:
          ref: cto/launch-readiness-hardening
          fetch-depth: 0

      - name: Record heartbeat
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/rc-status
          printf 'actions-heartbeat-ok\n' > .github/rc-status/actions-heartbeat.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/rc-status/actions-heartbeat.txt
          git commit -m 'ci: record Actions heartbeat'
          git push origin HEAD:cto/launch-readiness-hardening
